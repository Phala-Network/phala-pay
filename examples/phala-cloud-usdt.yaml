# Mainnet USDT route template, beside phala-cloud-pha.yaml. No treasury: each account proves its
# own per chain through the API (docs/design/multi-tenant.md D10). Ships inside the dstack compose,
# so every value is part of the attested measurement (docs/architecture.md §14). Changing a value
# is a new version and a new approved compose hash. Every value not written here is a code default,
# as attested as the file (the image digest is in the compose hash); `topup route show` prints the
# resolved route. Numbers are illustrative; finance and risk set the real ones.
route: phala-cloud-ethereum-usdt-usd
version: 1
livemode: true                     # a mainnet; test routes (testnets) are false

chain:
  chain_id: 1                      # default sanctions oracle: Chainalysis 0x40C5…aC8fb
  rpc_groups: { a: provider-a, b: provider-b }
  forwarder_factory: "0x0000000000000000000000000000000000000000" # the deterministic factory once deployed on the chain (deploy/CONTRACTS.md); the implementation is its first CREATE
  confirmations: 2                 # the floor and default (design D1): a depth, `safe` (OP-stack), or `finalized`; an account may require more

asset:
  symbol: usdt                     # the API's asset code
  # Tether's `TetherToken` (https://tether.to/en/supported-protocols/): its `transfer` returns
  # nothing, which the forwarder's SafeERC20 accepts (contracts/README.md). Its blacklist checks
  # only the sender: a blacklisted forwarder still receives and credits payments but cannot be
  # flushed, and a flush to a blacklisted treasury succeeds into funds the treasury cannot move.
  # Its fee switch (`basisPointsRate`, `maximumFee`) is zero; fee-on-transfer tokens are
  # unsupported (architecture §4). Monitor both, and handle either as
  # deploy/runbooks/usdt-issuer-controls.md says.
  contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
  decimals: 6
  backstop: addresses              # many transfers per block: requests by recipient (architecture §8)

price:
  mode: stablecoin
  sources:
    - { source: chainlink, feed: USDT_USD, chain_id: 1, rpc_group: a }
  peg_band_bps: 100

merchant:
  min_amount: { default: 100 } # USD 1.00; smaller deposits are rejected below_minimum
  max_deposit_atomic: { default: "10000000000" } # 10,000 USDT (pilot bound; product enforces its own caps too)
  min_refund_atomic: { default: "1000000" } # 1 USDT refundable dust floor
  quote_spread_bps: { default: 0 } # valued at a fixed 1.00 USD: no price move within the quote window for a spread to cover
