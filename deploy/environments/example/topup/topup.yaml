# A generic topup configuration (docs/configuration.md): replace every placeholder, which preflight
# refuses: the example hosts and the example admin key.
environment: production                   # the Sentry environment
max_attached_pending_refunds: 2
public_origin: https://pay-api.example.com # the API's one public origin: dstack-ingress's DOMAIN
admin_key:                                # from `topup-sdk keygen`; the seed never leaves its machine
  id: admin/production-v1
  public_key: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
# Two providers per chain, from different companies; the first a route names makes every log
# request. A key goes in `{key}` and is sealed as TOPUP_RPC_<ID>_KEY (compose.yaml).
rpc:
  - chain_id: 11155111
    read:
      id: ankr-sepolia
      url: "https://rpc.ankr.com/eth_sepolia/{key}"
      sealed_key: TOPUP_RPC_ANKR_KEY
      max_log_blocks: 3000
    verify:
      id: infura-sepolia
      url: "https://sepolia.infura.io/v3/{key}"
      sealed_key: TOPUP_RPC_INFURA_KEY
      max_log_blocks: 3000
  - chain_id: 84532
    read:
      id: ankr-base-sepolia
      url: "https://rpc.ankr.com/base_sepolia/{key}"
      sealed_key: TOPUP_RPC_ANKR_KEY
      max_log_blocks: 3000
    verify:
      id: infura-base-sepolia
      url: "https://base-sepolia.infura.io/v3/{key}"
      sealed_key: TOPUP_RPC_INFURA_KEY
      max_log_blocks: 3000
  - chain_id: 1
    read:
      id: ankr-mainnet
      url: "https://rpc.ankr.com/eth/{key}"
      sealed_key: TOPUP_RPC_ANKR_KEY
      max_log_blocks: 3000
    verify:
      id: infura-mainnet
      url: "https://mainnet.infura.io/v3/{key}"
      sealed_key: TOPUP_RPC_INFURA_KEY
      max_log_blocks: 3000
  - chain_id: 8453
    read:
      id: ankr-base-mainnet
      url: "https://rpc.ankr.com/base/{key}"
      sealed_key: TOPUP_RPC_ANKR_KEY
      max_log_blocks: 3000
    verify:
      id: infura-base-mainnet
      url: "https://base-mainnet.infura.io/v3/{key}"
      sealed_key: TOPUP_RPC_INFURA_KEY
      max_log_blocks: 3000

routes:
  - route: example-sepolia-usdc-usd
    version: 1
    livemode: false
    chain:
      chain_id: 11155111
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      confirmations: 2
      sanctions_oracle: "0x28A73f8235d966244210D9c49E34EDdA4fF9e1f6" # no Chainalysis oracle on Sepolia
    asset:
      symbol: usdc
      # Circle Sepolia USDC (https://faucet.circle.com).
      contract: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
      decimals: 6
    price:
      mode: stablecoin
      sources:
        - { source: chainlink, feed: USDC_USD, chain_id: 1, observation_chain_id: 11155111 }
      peg_band_bps: 100
    merchant:
      min_amount: { default: 100 }
      max_deposit_atomic: { default: "10000000000" }
      min_refund_atomic: { default: "1000000" }
      quote_spread_bps: { default: 0 }
  - route: example-sepolia-usdt-usd
    version: 1
    livemode: false
    chain:
      chain_id: 11155111
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      confirmations: 2
      sanctions_oracle: "0x28A73f8235d966244210D9c49E34EDdA4fF9e1f6" # no Chainalysis oracle on Sepolia
    asset:
      symbol: usdt
      # Aave testnet USDT (AaveV3Sepolia.USDT_UNDERLYING); faucet: 0xC959483DBa39aa9E78757139af0e9a2EDEb3f42D (mint(token, to, amount)).
      contract: "0xaA8E23Fb1079EA71e0a56F48a2aA51851D8433D0"
      decimals: 6
    price:
      mode: stablecoin
      sources:
        - { source: chainlink, feed: USDT_USD, chain_id: 1, observation_chain_id: 11155111 }
      peg_band_bps: 100
    merchant:
      min_amount: { default: 100 }
      max_deposit_atomic: { default: "10000000000" }
      min_refund_atomic: { default: "1000000" }
      quote_spread_bps: { default: 0 }
