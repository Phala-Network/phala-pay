# Phala's staging instance (deploy/phala.md): the service configuration of `topup`
# (docs/configuration.md), attested as an inline config of the rendered compose. A change is a pull
# request and a Deploy `upgrade`.
environment: staging
public_origin: https://pay-api-staging.phala.com
admin_key:
  id: admin/staging-v1
  public_key: 23Y9wEJMOTySGV3UXmcTFnQsbigA9/cYTvmqdQxzmdo=
# Independent A/B groups per chain, with keyless public backups (deploy/phala.md).
# A makes the scanner's log requests; a company belongs to only one group per chain.
rpc_companies:
  tenderly:
    domains:
    - tenderly.co
  publicnode:
    domains:
    - publicnode.com
  ethereum-foundation:
    # ethPandaOps team: github.com/ethpandaops; public Sepolia RPC, no API key.
    domains:
    - ethpandaops.io
  sentio:
    # Sentio's public testnet RPCs; reviewed against sentio.xyz and its official docs.
    domains:
    - sentio.xyz
rpc_budgets:
  tenderly-account:
    requests_per_second: 10
    burst: 10
  provider-a-key:
    requests_per_second: 10
    burst: 5
  publicnode-account:
    requests_per_second: 10
    burst: 10
  provider-b-key:
    requests_per_second: 10
    burst: 5
  base-sepolia-a-key:
    requests_per_second: 10
    burst: 5
  base-sepolia-b-key:
    requests_per_second: 10
    burst: 5
  sentio-account:
    requests_per_second: 5
    burst: 5
  sentio-sepolia-key:
    requests_per_second: 5
    burst: 2
  sentio-base-sepolia-key:
    requests_per_second: 5
    burst: 2
  ethpandaops-account:
    requests_per_second: 2
    burst: 2
  ethpandaops-sepolia-key:
    requests_per_second: 2
    burst: 2
rpc_groups:
  provider-a:
    chain_id: 11155111
    policy:
      probe: { attempts: 3, deadline: 30000 }
    members:
    - id: provider-a
      company: tenderly
      url: https://sepolia.gateway.tenderly.co
      account_budget: tenderly-account
      key_budget: provider-a-key
    - id: sentio-sepolia-a
      company: sentio
      url: https://sepolia.rpc.sentio.xyz
      account_budget: sentio-account
      key_budget: sentio-sepolia-key
      priority: 10
  provider-b:
    chain_id: 11155111
    policy:
      probe: { attempts: 3, deadline: 30000 }
    members:
    - id: provider-b
      company: publicnode
      url: https://ethereum-sepolia-rpc.publicnode.com
      account_budget: publicnode-account
      key_budget: provider-b-key
    - id: ethpandaops-sepolia-b
      company: ethereum-foundation
      url: https://rpc.sepolia.ethpandaops.io
      account_budget: ethpandaops-account
      key_budget: ethpandaops-sepolia-key
      priority: 10
  base-sepolia-a:
    chain_id: 84532
    policy:
      probe: { attempts: 3, deadline: 30000 }
    members:
    - id: base-sepolia-a
      company: tenderly
      url: https://base-sepolia.gateway.tenderly.co
      account_budget: tenderly-account
      key_budget: base-sepolia-a-key
    - id: sentio-base-sepolia-a
      company: sentio
      url: https://base-sepolia.rpc.sentio.xyz
      account_budget: sentio-account
      key_budget: sentio-base-sepolia-key
      priority: 10
  base-sepolia-b:
    chain_id: 84532
    policy:
      probe: { attempts: 3, deadline: 30000 }
    members:
    - id: base-sepolia-b
      company: publicnode
      url: https://base-sepolia-rpc.publicnode.com
      account_budget: publicnode-account
      key_budget: base-sepolia-b-key
# Every value a route does not write is a code default (docs/architecture.md §14);
# `topup config show` prints the resolved routes.
routes:
  # Staging route on Base Sepolia, the PHA route of Sepolia on a second chain: a test-mode route
  # (`livemode: false`) any account can quote on and pay its own treasury through. Test PHA here is
  # the same MockERC20 as on Sepolia (18 decimals, public `mint`). Route files carry no treasury
  # (design D10); the factory and implementation are the deterministic deployment of
  # deploy/CONTRACTS.md, the same address on every chain.
  - route: phala-cloud-base-sepolia-pha-usd
    version: 1
    livemode: false

    chain:
      chain_id: 84532
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      # Base Sepolia is an OP-stack chain (design D1, architecture §8): credited at depth 3 on the
      # sequencer's unsafe head, 4 s after inclusion (about 7 s after paying), and watched to
      # finality like Sepolia's depth 2. `3` is the family default, written out here; an account
      # may require more, `safe`, or `finalized`, never less.
      confirmations: 3
      rpc_groups: { a: base-sepolia-a, b: base-sepolia-b } # this chain's own (deploy/phala.md, "Staging routes")
      sanctions_oracle: "0x8A0C93d85a05aD30741C193068abF2e5E16e7b35" # no Chainalysis oracle on Base Sepolia

    asset:
      symbol: pha
      contract: "0x1a6F260377e42ead1418C7C1afDFD5DE371A9284"
      decimals: 18
      # No transfer since it was deployed (the last 100 000 blocks, Sep 2026): one token-wide log
      # request per range. The USDC route still puts the whole chain in address mode (architecture §8).
      backstop: token

    pricing:
      primary: { source: coinmetrics, asset: pha }
      check: { source: binance, symbol: PHAUSDT }

    merchant:
      min_amount: { default: 100 }
      max_deposit_atomic: { default: "200000000000000000000000" }
      min_refund_atomic: { default: "20000000000000000000" }
  # Staging route on Base Sepolia for Circle's testnet USDC (https://faucet.circle.com), beside the
  # PHA route: a test-mode route (`livemode: false`) any account can quote on and pay its own
  # treasury through. The token is the one Circle lists for Base Sepolia
  # (https://developers.circle.com/stablecoins/usdc-contract-addresses): FiatTokenV2_2 behind
  # Circle's proxy, a plain ERC-20 with no transfer fee or rebasing. The chain section is the PHA
  # route's: one chain has one set of chain settings. Route files carry no treasury (design D10).
  - route: phala-cloud-base-sepolia-usdc-usd
    version: 1
    livemode: false

    chain:
      chain_id: 84532
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      # Base Sepolia is an OP-stack chain (design D1, architecture §8): credited at depth 3 on the
      # sequencer's unsafe head, 4 s after inclusion (about 7 s after paying), and watched to
      # finality like Sepolia's depth 2. `3` is the family default, written out here; an account
      # may require more, `safe`, or `finalized`, never less.
      confirmations: 3
      rpc_groups: { a: base-sepolia-a, b: base-sepolia-b } # this chain's own (deploy/phala.md, "Staging routes")
      sanctions_oracle: "0x8A0C93d85a05aD30741C193068abF2e5E16e7b35" # no Chainalysis oracle on Base Sepolia

    asset:
      symbol: usdc
      contract: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      decimals: 6
      # About 1 to 1.5 transfers per block on Base Sepolia (1 740 to 3 065 in 2 000 blocks, up to 14 in
      # one, Sep 2026): a token-wide 2 000-block backstop window would be up to 1.9 MB and a third of
      # providers' 10 000-log response caps. Address mode puts the whole chain, PHA included, on
      # requests by recipient (architecture §8).
      backstop: addresses

    pricing:
      mode: stablecoin # credited at 1.00 while Coin Metrics' USDC reference rate is within 1% of it
      primary: { source: coinmetrics, asset: usdc }

    merchant:
      min_amount: { default: 100 } # USD 1.00, as on the PHA route
      max_deposit_atomic: { default: "10000000000" } # 10,000 USDC, about the PHA route's 200,000 PHA
      min_refund_atomic: { default: "1000000" } # 1 USDC, about the PHA route's 20 PHA
      quote_spread_bps: { default: 0 } # valued at a fixed 1.00 USD: no price move within the quote window for a spread to cover
  # Staging route on Base Sepolia for Aave's testnet USDT, beside the PHA and USDC routes: a
  # test-mode route (`livemode: false`) any account can quote on and pay its own treasury through.
  # Tether publishes no testnet USDT; the token is the one Aave's address book lists for its Base
  # Sepolia market (bgd-labs/aave-address-book, `AaveV3BaseSepolia.USDT_UNDERLYING`), a plain
  # 6-decimal ERC-20 with no transfer fee or rebasing that its faucet,
  # `0xD9145b5F45Ad4519c7ACcD6E0A4A82e83bB8A6Dc`, mints to anyone (`mint(token, to, amount)`).
  # The chain section is the PHA route's: one chain has one set of chain settings. Route files carry
  # no treasury (design D10).
  - route: phala-cloud-base-sepolia-usdt-usd
    version: 1
    livemode: false

    chain:
      chain_id: 84532
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      # Base Sepolia is an OP-stack chain (design D1, architecture §8): credited at depth 3 on the
      # sequencer's unsafe head, 4 s after inclusion (about 7 s after paying), and watched to
      # finality like Sepolia's depth 2. `3` is the family default, written out here; an account
      # may require more, `safe`, or `finalized`, never less.
      confirmations: 3
      rpc_groups: { a: base-sepolia-a, b: base-sepolia-b } # this chain's own (deploy/phala.md, "Staging routes")
      sanctions_oracle: "0x8A0C93d85a05aD30741C193068abF2e5E16e7b35" # no Chainalysis oracle on Base Sepolia

    asset:
      symbol: usdt
      contract: "0x0a215D8ba66387DCA84B284D18c3B4ec3de6E54a"
      decimals: 6
      # 2 transfers in 2 000 blocks (Oct 2026): one token-wide log request per range. The USDC route
      # still puts the whole chain in address mode (architecture §8).
      backstop: token

    pricing:
      mode: stablecoin # credited at 1.00 while Coin Metrics' USDT reference rate is within 1% of it
      primary: { source: coinmetrics, asset: usdt }

    merchant:
      min_amount: { default: 100 } # USD 1.00, as on the PHA route
      max_deposit_atomic: { default: "10000000000" } # 10,000 USDT, as on the USDC route
      min_refund_atomic: { default: "1000000" } # 1 USDT, as on the USDC route
      quote_spread_bps: { default: 0 } # valued at a fixed 1.00 USD: no price move within the quote window for a spread to cover
  # Staging route on Sepolia: a test-mode route (`livemode: false`) any account can quote on and pay
  # its own treasury through; the staging reference-product CVM uses it (deploy/phala.md, "Staging
  # reference product"). Route files carry no treasury: each account proves its own per chain
  # through the API (docs/design/multi-tenant.md D10). The factory and implementation are the
  # deterministic deployment of deploy/CONTRACTS.md, the same address on every chain.
  - route: phala-cloud-sepolia-pha-usd
    version: 3
    livemode: false

    chain:
      chain_id: 11155111
      rpc_groups: { a: provider-a, b: provider-b }
      forwarder_factory: "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747"
      confirmations: 2 # the floor and default (design D1); an account may require more, never less
      sanctions_oracle: "0x28A73f8235d966244210D9c49E34EDdA4fF9e1f6" # no Chainalysis oracle on Sepolia

    asset:
      symbol: pha
      contract: "0x8F40e7E99678F44c88158f049E62817580ab113B"
      decimals: 18
      backstop: token # few transfers per block: one token-wide log request per range (architecture §8)

    pricing:
      primary: { source: coinmetrics, asset: pha }
      check: { source: binance, symbol: PHAUSDT }

    merchant:
      min_amount: { default: 100 }
      max_deposit_atomic: { default: "200000000000000000000000" }
      min_refund_atomic: { default: "20000000000000000000" }
