# Phala's staging public settings and complete Ankr/Infura sealed-key mappings.
# topup's own settings are in topup.yaml.
services:
  postgres:
    environment: &walg
      WALG_S3_PREFIX: s3://crypto-topup-test/staging-v030
      AWS_ENDPOINT: https://1d694c298092ffa09c793cbca4587812.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_S3_FORCE_PATH_STYLE: "true"
  backup:
    environment: *walg
  dstack-ingress:
    environment:
      DOMAIN: pay-api-staging.phala.com
  topup:
    environment: &rpc-keys
      TOPUP_RPC_ANKR_KEY: ${TOPUP_RPC_ANKR_KEY:-}
      TOPUP_RPC_INFURA_KEY: ${TOPUP_RPC_INFURA_KEY:-}
  restore-check:
    environment: *rpc-keys
