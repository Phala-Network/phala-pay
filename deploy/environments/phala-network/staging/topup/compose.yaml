# Phala's staging instance: the environment's public settings that are third-party env interfaces
# (WAL-G's backup location, dstack-ingress's domain). Its RPC providers are keyless, so it declares
# no TOPUP_RPC_<ID>_KEY; a keyed provider adds its name here, to topup and restore-check.
# topup's own settings are in topup.yaml.
services:
  postgres:
    environment: &walg
      WALG_S3_PREFIX: s3://crypto-topup-test/staging-v030
      AWS_ENDPOINT: https://1d694c298092ffa09c793cbca4587812.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_S3_FORCE_PATH_STYLE: "true"
  backup:
    environment: *walg
  dstack-ingress:
    environment:
      DOMAIN: pay-api-staging.phala.com
