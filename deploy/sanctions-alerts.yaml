# Signed admin metrics; Sentry alert tags and Crons mirror these conditions.
groups:
- name: sanctions
  rules:
  - alert: TopupSanctionsListStale
    expr: topup_sanctions_list_verified_age_seconds{source="ofac_sdn"} > 21600 or absent(topup_sanctions_list_verified_age_seconds{source="ofac_sdn"})
    labels: { severity: page }
  - alert: TopupSanctionsListVerifyFailed
    expr: increase(topup_sanctions_list_refresh_total{source="ofac_sdn",result=~"hash_mismatch|parse_error"}[5m]) > 0
    labels: { severity: page }
