# Dependencies whose install scripts pnpm may run. esbuild's and workerd's (cf's and the Cloudflare
# Vite plugin's) only check the platform binary that their optional dependency already provides.
# puppeteer's (through @mermaid-js/mermaid-cli) would download a browser: none is downloaded here,
# in CI, or in the Cloudflare build; `npm run diagrams` drives Playwright's Chromium instead.
allowBuilds:
  esbuild: false
  puppeteer: false
  workerd: false

# Reviewed upstream security releases; the exact pins fix Undici, Zod, and sharp.
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.5'
  - '@cloudflare/config@0.28.1'
  - '@cloudflare/runtime-types@0.1.16'
  - '@cloudflare/vite-plugin@2.0.0-beta.v.5'
  - cf@1.0.0-beta.23
  - miniflare@5.20261023.0-beta

overrides:
  # CVE-2026-118764 has no fixed 10.x release. Remove when parents require >=11.0.1.
  'minimatch@^10.0.0': ^11.0.1
  # React's exact npm dependency must use the same local core as the demo's direct dependency.
  '@phala/pay': file:../../../sdk/js
  # The CLI still requires vulnerable KaTeX ^0.16.25; use the fixed CSS/fonts with Mermaid 12.2.
  # Remove when @mermaid-js/mermaid-cli depends on katex >=0.18.2.
  '@mermaid-js/mermaid-cli@12.0.0>katex': ^0.18.2
