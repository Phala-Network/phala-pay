# Optional Prometheus equivalent: import into rule_files and scrape the admin-signed exporter.
# The service's once-per-minute business monitor already evaluates endpoint readiness, backfill/
# coverage lag, S/L stock and persisted rolling entries, H/Q budgets and address capacity.
# It emits tagged Sentry alerts; Sentry owns delivery/routing. No collector/key/workflow is
# required for those internal checks. Sanctions freshness has its own existing monitor.
# The increase(...[1d/7d]) provider-quota rules below REQUIRE a real time-series collector.
# Without one, check provider dashboards daily (shared Ankr includes staging), plus the manual
# D/recovery, factory and Safe tallies. Do not estimate rolling quotas from isolated snapshots.
groups:
  - name: phala-pay-rpc
    rules:
      - alert: RpcEvidenceDisagreement
        expr: sum by (chain_id) (increase(topup_rpc_errors_total{class="disagreement"}[5m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Read and verify evidence disagreed on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/provider-disagreement.md"
      - alert: RpcEndpointUnavailable
        expr: topup_rpc_endpoint_ready == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Endpoint {{ $labels.provider }} unavailable on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcCoverageLag
        expr: topup_coverage_lag_seconds > 7200
        labels: { severity: warning }
        annotations:
          summary: "Dual coverage is over two hours behind on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcAddressBackfillLag
        expr: topup_addresses_lagging > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Address history still needs dual backfill on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcUnresolvedDepositStock
        expr: sum(topup_finality_unresolved) > 1
        labels: { severity: critical }
        annotations:
          summary: "More than one deposit remains unresolved after a due finality check"
          description: "Pause new quotes in this environment until unresolved deposit stock returns to at most one."
          runbook: "deploy/runbooks/deposit-reversed.md"
      - alert: RpcUnresolvedDepositEntries
        expr: sum(topup_finality_unresolved_entries_24h) > 1
        labels: { severity: critical }
        annotations:
          summary: "More than one deposit first became unresolved in the last 24 hours"
          description: "Pause new quotes in this environment until the rolling unresolved entry count returns to at most one."
          runbook: "deploy/runbooks/deposit-reversed.md"
      - alert: RpcConfirmationProviderLag
        expr: sum(topup_confirmation_slow) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Confirmation slow lane has remained non-empty for ten minutes"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcConfirmationSlowStock
        expr: sum(topup_confirmation_slow) > 1
        labels: { severity: critical }
        annotations:
          summary: "Confirmation slow lane stock exceeds one in this environment"
          description: "Pause new quotes and new payment load; keep verifying existing funds and retain reservations."
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcConfirmationSlowEntries
        expr: sum(topup_confirmation_slow_entries_24h) > 1
        labels: { severity: critical }
        annotations:
          summary: "More than one deposit entered the confirmation slow lane in the last 24 hours"
          description: "Pause new quotes and new payment load until the rolling count returns to at most one."
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcPriceSnapshotBudgetExhausted
        expr: topup_daily_budget_used{name=~"price:.*"} >= topup_daily_budget_limit{name=~"price:.*"}
        labels: { severity: warning }
        annotations:
          summary: "Fresh quote snapshot budget exhausted until UTC midnight"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcHintBudgetExhausted
        expr: topup_daily_budget_used{name="hints"} >= topup_daily_budget_limit{name="hints"}
        labels: { severity: warning }
        annotations:
          summary: "Transaction hint task budget exhausted until UTC midnight"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcAddressCapacityWarning
        expr: topup_issued_addresses / topup_issued_address_cap >= 0.7
        labels: { severity: warning }
        annotations:
          summary: "Historical address count has reached 70% of the cap on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/address-capacity.md"
      - alert: RpcAddressCapacityCritical
        expr: topup_issued_addresses / topup_issued_address_cap >= 0.9
        labels: { severity: critical }
        annotations:
          summary: "Historical address count has reached 90% of the cap on chain {{ $labels.chain_id }}"
          runbook: "deploy/runbooks/address-capacity.md"
      - record: topup_rpc_daily_calls
        expr: sum by (provider, chain_id) (increase(topup_rpc_calls_total[1d]))
      # Staging only: production has no Infura endpoints.
      - record: topup_rpc_infura_daily_credits
        expr: sum by (provider, chain_id) (increase(topup_rpc_calls_total{provider=~"infura-.*",method="eth_getLogs"}[1d])) * 255 + sum by (provider, chain_id) (increase(topup_rpc_calls_total{provider=~"infura-.*",method!="eth_getLogs"}[1d])) * 80
      - alert: RpcInfuraQuotaPressure
        expr: sum(topup_rpc_infura_daily_credits) > 1500000
        labels: { severity: warning }
        annotations:
          summary: "Staging Infura daily credits exceed 1,500,000; stop adding load"
          runbook: "deploy/runbooks/rpc-health.md"
      # Production only: one BlockPI account across both chain keys. Base RU rates exclude
      # eth_getLogs response-size surcharges; reconcile with the provider dashboard.
      - record: topup_rpc_blockpi_weekly_ru
        expr: >-
          (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method="eth_getLogs"}[7d])) or vector(0)) * 50
          + (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method=~"eth_getCode|eth_getTransactionReceipt"}[7d])) or vector(0)) * 15
          + (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method="eth_blockNumber"}[7d])) or vector(0)) * 10
          + (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method="eth_chainId"}[7d])) or vector(0)) * 5
          + (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method=~"eth_getBlockByNumber|eth_getBlockByHash|eth_call"}[7d])) or vector(0)) * 20
          + (sum(increase(topup_rpc_calls_total{provider=~"blockpi-.*",method!~"eth_getLogs|eth_getCode|eth_getTransactionReceipt|eth_blockNumber|eth_chainId|eth_getBlockByNumber|eth_getBlockByHash|eth_call"}[7d])) or vector(0)) * 35
      - alert: RpcBlockpiQuotaPressure
        expr: topup_rpc_blockpi_weekly_ru / 7 > 1250000
        labels: { severity: warning }
        annotations:
          summary: "Production BlockPI seven-day run rate exceeds 1,250,000 RU/day; stop adding load"
          runbook: "deploy/runbooks/rpc-health.md"
      - alert: RpcAnkrQuotaPressure
        expr: sum(sum by (provider) (increase(topup_rpc_calls_total{provider=~"ankr-.*"}[7d]))) / 7 > 25000
        labels: { severity: warning }
        annotations:
          summary: "Ankr seven-day run rate exceeds 25,000 calls/day; stop adding load"
          runbook: "deploy/runbooks/rpc-health.md"
