# CVM rehearsal overlay, applied by deploy/local/cvm-rehearsal.sh after the compose
# deploy/render.sh rendered from a staging-shaped environment (the rehearsal's own addresses and
# providers). It replaces only what a CVM provides and a workstation does not: the dstack socket
# (the simulator), object storage (s3.compose.yml), and the asset chains (an Anvil with Sepolia's
# chain id and one with Base Sepolia's, for the committed routes of each). Images, commands,
# settings, inline configs, and healthchecks all come from the rendered file, and the secrets from a
# `.env` of the rendered compose's sealed names.
#
# The exception is the custom domain: dstack-ingress does not run, because tls-alpn-01 needs the
# public DNS records and Let's Encrypt connecting through the dstack gateway (the upstream
# TESTING.md tests it only on a real CVM), and running it here would register ACME accounts from
# every rehearsal. Clients call topup on the compose network instead, so that is its origin
# (--public-origin), and webhooks go straight to the product's private address, which smokescreen
# refuses by design (deploy/tests/smokescreen.sh tests the proxy); validate-compose.sh checks the
# ingress definition.
#
# Like the restore drill, nothing here bind-mounts a host path (CI's Docker daemon cannot see
# the checkout) and the workload publishes no host port; only the Anvils are published, on loopback
# ports the script picks, so the contract scripts can deploy to them. `!override` and `!reset` need
# Compose 2.24.4 or newer.
include:
  - s3.compose.yml

services:
  dstack-simulator:
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:?build the simulator image first}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  anvil:
    networks: !override
      default: { aliases: [anvil-b, provider-a.tenderly.test, sentio-sepolia-a.sentio.test, provider-b.publicnode.test, ethpandaops-sepolia-b.ethereum-foundation.test] }
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }

  # Base Sepolia's chain id, an OP-stack one: its routes credit at depth 3 on Anvil's head.
  anvil-base-sepolia:
    networks: !override
      default: { aliases: [anvil-base-sepolia-b, base-sepolia-a.tenderly.test, sentio-base-sepolia-a.sentio.test, base-sepolia-b.publicnode.test] }
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }
    command: !override
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "84532"
      - --block-time
      - "1"
      - --slots-in-an-epoch
      - "4"
    ports: !override
      - "127.0.0.1:${REHEARSAL_BASE_SEPOLIA_ANVIL_PORT:-18546}:8545"

  # Hermetic price observation chains. They use production chain ids and fixture bytecode at the
  # reviewed feed/pair addresses, so CI never reaches Ethereum or Base public RPCs.
  anvil-mainnet-price:
    networks: !override
      default: { aliases: [price-mainnet-a.tenderly.test, price-mainnet-a-mevblocker.mevblocker.test, price-mainnet-b.drpc.test, price-mainnet-b-flashbots.flashbots.test] }
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }
    command: !override
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "1"
      - --timestamp
      - "${REHEARSAL_PRICE_ANVIL_TIMESTAMP:-1}"
    ports: !override
      - "127.0.0.1:${REHEARSAL_MAINNET_PRICE_ANVIL_PORT:-18547}:8545"

  anvil-base-mainnet-price:
    networks: !override
      default: { aliases: [price-base-mainnet-a.tenderly.test, price-base-mainnet-a-sentio.sentio.test, price-base-mainnet-b.publicnode.test, price-base-mainnet-b-llama.llama.test] }
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }
    command: !override
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "8453"
      - --timestamp
      - "${REHEARSAL_PRICE_ANVIL_TIMESTAMP:-1}"
    ports: !override
      - "127.0.0.1:${REHEARSAL_BASE_MAINNET_PRICE_ANVIL_PORT:-18548}:8545"

  # Local responses for the staging-only PHA check. The service aliases match the reviewed
  # exchange hostnames; test-only endpoint overrides keep CI off the public Internet.
  price-stub:
    image: ${TOPUP_TEST_TLS_IMAGE:-ghcr.io/astral-sh/uv:0.12.18-python3.14-trixie-slim@sha256:00facf17b58b02b725155862c5cd637f688f906bf7eb5b5194647886d8805cf3}
    command: [python, /etc/price-stub/server.py, "8080"]
    networks:
      default:
        aliases: [api.kraken.com, data-api.binance.vision]
    configs:
      - source: price_stub_server
        target: /etc/price-stub/server.py

  # Fixed production SLS URLs resolve here on this disposable network. TLS verification uses
  # the rehearsal's certificate; neither endpoint can reach real OFAC.
  sanctions-stub:
    image: ${TOPUP_TEST_TLS_IMAGE:?}
    command: [python, /etc/sanctions-stub/server.py, "443", /etc/sanctions-stub/sdn.xml, /etc/test-tls/cert.pem, /etc/test-tls/key.pem]
    networks:
      default:
        aliases: [sanctionslistservice.ofac.treas.gov]
    configs:
      - source: sanctions_stub_server
        target: /etc/sanctions-stub/server.py
      - source: sanctions_stub_xml
        target: /etc/sanctions-stub/sdn.xml
      - source: test_tls_certificate
        target: /etc/test-tls/cert.pem
      - source: test_tls_key
        target: /etc/test-tls/key.pem
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", python, "-c", "import socket; socket.create_connection(('127.0.0.1', 443), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: "no"

  keys:
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy

  # The local Garage store is plain http (deploy/scripts/postgres-walg-entrypoint.sh).
  postgres:
    environment:
      TOPUP_OBJECT_STORE_ALLOW_HTTP: "on"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  backup:
    environment:
      TOPUP_OBJECT_STORE_ALLOW_HTTP: "on"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  topup:
    command: [topup, run, --config, /etc/topup/topup.yaml, --public-origin, "http://topup:8080"]
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
    environment:
      TOPUP_TEST_KRAKEN_ENDPOINT: http://price-stub:8080/0/public/Ticker
      TOPUP_TEST_BINANCE_ENDPOINT: http://price-stub:8080/api/v3/ticker/price
    depends_on:
      dstack-simulator:
        condition: service_healthy
      anvil:
        condition: service_healthy
      anvil-base-sepolia:
        condition: service_healthy
      anvil-mainnet-price:
        condition: service_healthy
      anvil-base-mainnet-price:
        condition: service_healthy
      price-stub:
        condition: service_started
      sanctions-stub:
        condition: service_healthy

  # A profile the rehearsal never enables (see the header).
  dstack-ingress:
    profiles: [cvm]

volumes:
  dstack_socket:

configs:
  price_stub_server:
    content: ${TOPUP_PRICE_STUB_SERVER:-# rehearsal supplies the hermetic price stub}
  sanctions_stub_server:
    content: ${TOPUP_SANCTIONS_STUB_SERVER:?}
  sanctions_stub_xml:
    content: ${TOPUP_SANCTIONS_STUB_XML:?}
