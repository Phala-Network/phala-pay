# Sandbox route template for one integrator product on Sepolia (and the local Anvil stack, which
# runs with chain id 11155111 so the same file works unchanged). Render it with render-route.sh,
# which refuses leftover placeholders, then validate with `topup route validate` (no --template).
# Caps are deliberately small: the sandbox carries test tokens only and must never hold value.
# Every value not written here is a code default (docs/architecture.md §14).
route: sandbox-${PRODUCT_SLUG}-tpha-usd
version: 1
livemode: false

chain:
  chain_id: 11155111
  rpc_groups: { a: provider-a, b: provider-b }
  forwarder_factory: "${FORWARDER_FACTORY}"
  confirmations: 2
  # The sandbox deploys MockSanctionsOracle; there is no Chainalysis oracle on Sepolia.
  sanctions_oracle: "${SANCTIONS_ORACLE}"

# The sandbox test token is the A1 MockERC20 (18 decimals, public mint). It is valued as PHA so
# integrators see production-shaped quotes; it has no market value of its own.
asset:
  symbol: pha
  contract: "${TEST_TOKEN}"
  decimals: 18
  backstop: token

price:
  mode: volatile
  allow_unclear_sources: true # staging only; production refuses Unclear sources
  primary: [{ source: kraken, symbol: PHAUSD, company: kraken }]
  check: [{ source: binance, symbol: PHAUSDT, company: binance }]
  fx: [{ source: kraken, symbol: USDTUSD, company: kraken }]

merchant:
  min_amount: { default: 100 }
  max_deposit_atomic: { default: "50000000000000000000000" }
  min_refund_atomic: { default: "20000000000000000000" }
  quote_ttl_seconds: { default: ${RATE_LOCK_WINDOW_S} }
