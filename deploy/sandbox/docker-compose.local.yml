# Local sandbox overlay: `deploy/local/compose.sh -f deploy/sandbox/docker-compose.local.yml ...`. Adds a
# disposable Anvil chain with Sepolia's chain id, which the sandbox's configuration names as its
# providers (run-local.sh writes it); run-local.sh drives the whole flow.
services:
  anvil:
    networks:
      default: { aliases: [anvil-b] }
    image: ghcr.io/foundry-rs/foundry:v1.8.3@sha256:2e4287278639262de76db72477301d5d3212fa1b1cce710d7d148750a46ce9e7
    entrypoint: ["anvil"]
    # One-second blocks with `finalized` eight blocks behind the head keep scenarios fast while
    # still exercising the service's finality rule and leaving the head scan (every scanner poll,
    # one second here) time to show a payment as `seen` before it is final.
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "11155111"
      - --block-time
      - "1"
      - --slots-in-an-epoch
      - "4"
    ports:
      - "127.0.0.1:${SANDBOX_ANVIL_PORT:-18545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  topup:
    command:
      - topup
      - run
      - --config
      - /etc/topup/topup.yaml
      # The example and scenarios call the service on the compose network.
      - --public-origin
      - http://topup:8080
      - --wait-interval-s
      - "2"
    depends_on:
      anvil:
        condition: service_healthy
