[workspace]
members = ["crates/adapters", "crates/core", "crates/topup"]
resolver = "3"

[workspace.package]
version = "0.9.1-rc.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy = { version = "=2.5.0", default-features = false, features = ["json-rpc", "provider-http", "reqwest-rustls-tls", "rpc-client", "rpc-types", "sol-types"] }
alloy-consensus = { version = "=2.5.0", default-features = false, features = ["k256", "std"] }
alloy-eips = { version = "=2.5.0", default-features = false, features = ["std"] }
alloy-network = { version = "=2.5.0", default-features = false }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "serde"] }
alloy-provider = { version = "=2.5.0", default-features = false, features = ["reqwest"] }
alloy-rpc-client = { version = "=2.5.0", default-features = false }
alloy-serde = { version = "=2.5.0", default-features = false }
alloy-signer = { version = "=2.5.0", default-features = false }
alloy-signer-local = { version = "=2.5.0", default-features = false }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-transport = { version = "=2.5.0", default-features = false }
anyhow = "=1.0.104"
async-trait = "=0.1.92"
alloy-tx-macros = { version = "=2.5.0", default-features = false }
axum = { version = "=0.8.9", features = ["json", "query", "tokio"] }
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
crc = "=3.4.0"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
hex = "=0.4.3"
hmac = "=0.13.0"
httpdate = "=1.0.3"
prometheus = { version = "=0.14.0", default-features = false }
proptest = "=1.11.0"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
secrecy = "=0.10.3"
sentry = { version = "=0.49.3", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls", "tracing", "metrics"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sfv = "=0.15.0"
sha2 = "=0.11.0"
# EIP-4361 (Sign-In with Ethereum) messages; signatures are checked with Alloy.
siwe = { version = "=0.6.1", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
static_assertions = "=1.1.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "retry", "limit", "load-shed"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
utoipa = { version = "=6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "=0.3.0"
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["serde", "v4", "v5"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 1
