  "vulnerabilities": [
    {
      "id": "RUSTSEC-2026-0387",
      "purls": ["pkg:cargo/crypto-bigint@0.5.5"],
      "statement": "Re-reviewed 2026-11-24. The locked native topup graph still requires crypto-bigint 0.5.5 via elliptic-curve 0.13.8. The latest Alloy signer (2.6.1), Alloy primitives (1.7.3) and dstack-sdk (0.6.0) still require k256 ^0.13, which excludes k256 0.14.0. The crypto-bigint 0.5.x series ends at 0.5.5. Secret-scalar validation constructs a secp256k1 public key inside the TEE for backup and database key provisioning, client-secret initialization at startup, and initialization of the operator-run migration import job. These paths have no request-triggered or remotely repeatable call site in topup. Runtime webhook signing uses Ed25519, and secp256k1 signature recovery/verification uses public inputs. Remove when Alloy/k256 and the dstack SDK resolve crypto-bigint >=0.7.6. Reassess if secret secp256k1 operations become request-triggered or startup control or deployment isolation changes. Tracking and required re-review: https://github.com/Phala-Network/phala-pay/issues/536.",
      "expired_at": "2026-12-09T00:00:00Z"
    },
    {
      "id": "RUSTSEC-2026-0543",
      "purls": ["pkg:cargo/chrono@0.4.45"],
      "statement": "Reviewed 2026-11-24. RustSec reports a maintenance notice covering all chrono versions and lists no patched release. The native graph uses chrono 0.4.45 for topup and adapter timestamps, the SQLx PostgreSQL timestamp codecs, and S3 migration through object_store. The latest object_store (0.14.2) still requires chrono, even if the application and SQLx switch timestamp types. Remove when the supported dependency graph drops chrono or RustSec withdraws the notice. Reassess if the dependency path or advisory changes. Tracking and required re-review: https://github.com/Phala-Network/phala-pay/issues/699.",
      "expired_at": "2026-12-09T00:00:00Z"
    },
    {
      "id": "RUSTSEC-2026-0542",
      "purls": ["pkg:cargo/humantime@2.4.0"],
      "statement": "Reviewed 2026-11-24. RustSec reports a maintenance notice covering all humantime versions and lists no patched release. The native graph uses humantime 2.4.0 only through object_store 0.14.2, the latest release. object_store uses it for duration settings in the S3 client used by operator-run migration jobs. Payment requests do not reach this parser. Remove when a supported object_store release drops humantime (https://github.com/apache/arrow-rs-object-store/issues/292) or RustSec withdraws the notice. Reassess if the dependency path or advisory changes. Tracking and required re-review: https://github.com/Phala-Network/phala-pay/issues/699.",
      "expired_at": "2026-12-09T00:00:00Z"
    },
    {
      "id": "RUSTSEC-2026-0441",
      "purls": ["pkg:cargo/pin-utils@0.1.0"],
      "statement": "pin-utils is unmaintained after its repository was archived; this is a maintenance notice, not a reported vulnerability, and no patched version exists. The locked Alloy 2.5.0 provider/rpc-client/transport crates pull pin-utils 0.1.0 through wasmtimer 0.4.3 only for cfg(all(target_family = \"wasm\", target_os = \"unknown\")); wasmtimer and pin-utils are absent from the native Linux service runtime. Alloy and wasmtimer are already at their latest supported releases, so no supported parent upgrade removes pin-utils. This entry records the cargo-deny exception's required exposure review and expiry. Remove when a supported Alloy/wasmtimer release drops pin-utils; reassess immediately if a wasm runtime is introduced or the dependency path changes. Tracking and required re-review: https://github.com/Phala-Network/phala-pay/issues/626.",
      "expired_at": "2026-12-05T00:00:00Z"
    },
    {
      "id": "RUSTSEC-2026-0374",
      "purls": ["pkg:cargo/basic-toml@0.1.10"],
      "statement": "age 0.12.1 unconditionally uses i18n-config 0.4.8 to compile localization macros; its basic-toml parser is build-time only and has no runtime use in topup or migration jobs. This is an unmaintained-crate notice, with no fixed supported release. Upstream age and i18n-config releases were checked on 2026-11-06. Remove when an upstream release drops basic-toml; reassess immediately if the dependency enters runtime or processes untrusted inputs. Tracking and required re-review: https://github.com/Phala-Network/phala-pay/issues/625.",
      "expired_at": "2026-12-05T00:00:00Z"
    }
  ]
