version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
  # sdk/js is the pnpm workspace root (pnpm-workspace.yaml) for @phala/pay, @phala/pay-react and
  # @phala/pay-server, which share its one lockfile: a single entry updates all three together.
  - package-ecosystem: npm
    directory: /sdk/js
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      js-sdk:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /deploy/product/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs/reference
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-docs:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /deploy/tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      deploy-tools:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      deploy-images:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/local
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      local-images:
        patterns: ["*"]
        update-types: [minor, patch]
