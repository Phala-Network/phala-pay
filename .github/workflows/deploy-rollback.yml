name: Deploy rollback

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  merge_group:

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      SQLX_OFFLINE: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rollback-${{ hashFiles('**/Cargo.lock') }}
      - name: Deadline and capacity probe tests
        run: |
          deploy/tests/stage-deadlines.sh
          deploy/tests/capacity.sh
          deploy/tests/rollback-policy.sh
      - name: Build current migration binary
        run: cargo build --locked -p topup
      - name: Install the GitHub CLI 2.101.0
        timeout-minutes: 10
        run: |
          version=2.101.0
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/cli/cli/releases/download/v$version/gh_${version}_linux_amd64.tar.gz"
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_amd64/bin" >>"$GITHUB_PATH"

      - name: Resolve and verify the previous stable release
        timeout-minutes: 10
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Rollback release resolution failed at line $LINENO (exit $status)" >&2; exit "$status"' ERR
          source deploy/deadline.sh
          source deploy/github-read.sh
          stage_start rollback-release-resolution 600
          releases=$(github_read api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          previous=$(jq -er --arg current "$GITHUB_REF_NAME" \
            '[.[] | select(.draft == false and .prerelease == false and .tag_name != $current)] | .[0].tag_name // empty | select(. != "")' \
            <<<"$releases") || { echo '::error::Release lookup returned no previous stable tag or invalid release data' >&2; exit 1; }
          [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { printf '::error::Invalid previous stable release tag: %q\n' "$previous" >&2; exit 1; }
          echo "Previous stable release: $previous" >&2
          current=$(scripts/version.sh) || { echo '::error::Cannot determine the current version' >&2; exit 1; }
          mode=$(deploy/rollback-policy.sh "$previous" CHANGELOG.md "$current") ||
            { echo "::error::Rollback policy failed for $previous and current version $current" >&2; exit 1; }
          [[ "$mode" =~ ^(declared|rollback)$ ]] ||
            { printf '::error::Invalid rollback policy mode: %q\n' "$mode" >&2; exit 1; }
          echo "ROLLBACK_MODE=$mode" >>"$GITHUB_ENV"
          if [[ "$mode" == declared ]]; then
            {
              echo "### Declared restore-only release"
              echo "N-1: $previous."
              echo "Explicit Breaking declaration: no rollback to ${previous#v}; restore required."
              echo "Restore from the pre-upgrade backup: [restore runbook](deploy/RESTORE.md)."
              echo "The N-1 image smoke is skipped under the validated restore-only declaration."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          stage_call 600 deploy/verify-release.sh "$previous" "$RUNNER_TEMP/previous-release"
          previous_image=$(jq -er '.["phala-pay"]' "$RUNNER_TEMP/previous-release/images.json")
          echo "PREVIOUS_IMAGE=$previous_image" >>"$GITHUB_ENV"
          tar -xOf "$RUNNER_TEMP/previous-release/phala-pay-deploy-$previous.tar.gz" \
            "phala-pay-deploy-$previous/deploy/environments/example/topup/topup.yaml" >"$RUNNER_TEMP/previous-topup.yaml"
      - name: Current migration then previous release image startup
        if: env.ROLLBACK_MODE == 'rollback'
        timeout-minutes: 10
        run: deploy/tests/rollback-smoke.sh "$PWD/target/debug/topup" "$PREVIOUS_IMAGE" "$RUNNER_TEMP/previous-topup.yaml"
      - name: Published N-1 → N → N-1 → N chain read rollback drill
        if: env.ROLLBACK_MODE == 'rollback'
        timeout-minutes: 30
        run: deploy/local/rollback-drill.sh "$PREVIOUS_IMAGE" "$RUNNER_TEMP/previous-topup.yaml"
