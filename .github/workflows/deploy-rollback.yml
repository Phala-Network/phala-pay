name: Deploy rollback

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  merge_group:

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 4
      SQLX_OFFLINE: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rollback-${{ hashFiles('**/Cargo.lock') }}
      - name: Deadline and capacity probe tests
        run: |
          deploy/tests/stage-deadlines.sh
          deploy/tests/capacity.sh
          deploy/tests/rollback-policy.sh
      - name: Build current migration binary
        run: cargo build --locked -p topup
      - name: Install the GitHub CLI 2.101.0
        timeout-minutes: 10
        run: |
          version=2.101.0
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/cli/cli/releases/download/v$version/gh_${version}_linux_amd64.tar.gz"
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_amd64/bin" >>"$GITHUB_PATH"

      - name: Resolve and verify the previous stable release
        timeout-minutes: 10
        run: |
          section="$RUNNER_TEMP/rollback-release-notes"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            scripts/changelog-section.sh CHANGELOG.md "${GITHUB_REF_NAME#v}" >"$section"
          else
            awk '/^## / { if (active) exit; active = ($0 == "## [Unreleased]"); next } active' CHANGELOG.md >"$section"
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg current "$GITHUB_REF_NAME" '[.[] | select(.draft == false and .prerelease == false and .tag_name != $current)] | .[0].tag_name')
          [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mode=$(deploy/rollback-policy.sh "$previous" "$section")
          echo "ROLLBACK_MODE=$mode" >>"$GITHUB_ENV"
          if [[ "$mode" == bootstrap ]]; then
            {
              echo "### Rollback protocol bootstrap"
              echo "N-1: $previous (predates the compatibility-ledger protocol)."
              echo "Explicit Breaking declaration: no rollback to ${previous#v}; restore required."
              echo "Restore from the pre-upgrade backup: [restore runbook](deploy/RESTORE.md)."
              echo "The N-1 image rollback smoke is unavailable during this declared bootstrap."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deploy/verify-release.sh "$previous" "$RUNNER_TEMP/previous-release"
          echo "PREVIOUS_IMAGE=$(jq -r '.["phala-pay"]' "$RUNNER_TEMP/previous-release/images.json")" >>"$GITHUB_ENV"
          tar -xOf "$RUNNER_TEMP/previous-release/phala-pay-deploy-$previous.tar.gz" \
            "phala-pay-deploy-$previous/deploy/environments/example/topup/topup.yaml" >"$RUNNER_TEMP/previous-topup.yaml"
      - name: Current migration then previous release image startup
        if: env.ROLLBACK_MODE == 'rollback'
        timeout-minutes: 10
        run: deploy/tests/rollback-smoke.sh "$PWD/target/debug/topup" "$PREVIOUS_IMAGE" "$RUNNER_TEMP/previous-topup.yaml"
