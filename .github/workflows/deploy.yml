name: Deploy

# Provisions or upgrades one CVM on Phala Cloud with a release of Phala-Network/phala-pay
# (deploy/README.md, "Deploy"). A reusable workflow, called at the release (its tag or commit) with
# the same `version`, from the operator's environment repository and from Phala's own "Deploy
# Phala's instance" alike. Target `topup` is the service; target `product` is Phala's staging
# reference product (deploy/phala.md). Nothing is deployed from a laptop.
#
# It runs deploy/verify-release.sh of its own commit, which must be the release's: the release's
# commit is in main's history, its assets match SHA256SUMS, and every asset and image has the
# Release workflow's build provenance for that commit. It then runs only the verified kit's
# scripts on the caller's committed environment directory `environment_dir`, rendered with the
# release's images and the CVM node's gateway (deploy/README.md, "Attested settings"), with the
# kit's reviewed pre-launch script. A changed setting is a pull request in the caller's repository
# and a new compose hash, in force only through `upgrade`.
#
# Controls, in the caller's repository: the job runs only from its `main`, in the GitHub
# Environment `environment` (deployment branches: `main` only). The secrets it reads are the maintenance-only signing key and the
# declared, optional PHALA_CLOUD_API_KEY (docs/self-hosting.md, step 5). A caller in the
# Phala-Network organisation passes `secrets: inherit`, and the key is the Environment's secret,
# which GitHub uses over a passed secret of the same name; an Environment secret resolves empty
# here without `inherit` (actions/runner#4453). A caller in another organisation, where `inherit`
# is not supported, passes the key from a repository secret. Whoever dispatches a run is
# accountable for it; the run's attested compose and verifier read-back are the audit trail. The
# CVM's env holds only the owner-sealed secrets, the rendered compose's `${NAME:-}` references,
# which never enter GitHub: `provision` sends them empty, and the owner then seals them from their
# own machine (the run summary prints the command); `upgrade` sends no env at all, so the sealed
# env stays. Each target's public origin is its custom domain, served by dstack-ingress in the CVM
# (deploy/README.md, "Custom domain"); the summary lists the DNS records the owner creates for it.
#
# The kit's deploy/phala runs Phala Cloud CLI 1.1.22 with its dependencies locked (checked against
# Phala-Network/phala-cloud tag cli-v1.1.22), through deploy/phala-cvm.sh:
# - Authentication is the PHALA_CLOUD_API_KEY environment variable, which the CLI prefers over a
#   stored profile; PHALA_CLOUD_DIR points at an empty directory so no profile or API prefix from
#   the runner's home can be read. The API key belongs to the workspace in vars.PHALA_WORKSPACE.
# - The default `kms: phala` keeps provision/upgrade unchanged. Opt-in Base KMS uses the
#   reviewed environment's DstackApp and Safe with prepare/sign/commit; no chain key in CI.
# - Provision sends the kit's pre-launch script with `--pre-launch-script`; compose-update sets
#   that same script and the explicit port policy on upgrades and provisioning follow-ups.
#   verify-attestation.sh requires both in the attested app-compose.
# - `deploy --json` ignores `--wait` on a new CVM; this workflow waits by polling `cvms get`.

on:
  workflow_call:
    inputs:
      version:
        description: "The release to deploy, v<version>: the same release the caller calls this workflow at"
        type: string
        required: true
      environment:
        description: "The GitHub Environment: staging or production"
        type: string
        required: true
      target:
        description: "topup: the service CVM (vars.TOPUP_CVM_ID); product: Phala's staging reference-product CVM (vars.STAGING_PRODUCT_CVM_ID)"
        type: string
        default: topup
      mode:
        description: "Phala: provision/upgrade; Base KMS: prepare/commit after Safe approval"
        type: string
        required: true
      variant:
        description: "Topup compose: service, export, or migration-import (requires migration tooling release)"
        type: string
        default: service
      migration_plan:
        description: "Reviewed migration JSON path: export/import, or the current export plan for a service rollback (Phala upgrade only)"
        type: string
        default: ""
      source_info_artifact:
        description: "Export deployment artifact ID for rollback from export; contains this CVM's verified guest Info"
        type: string
        default: ""
      gateway_domain:
        description: "Pinned node gateway host for initial Base provisioning (gateway.<base-domain>)"
        type: string
        default: ""
      transaction_hash:
        description: "Executed Base Safe transaction hash; already-registered for an approved rollback"
        type: string
        default: ""
      environment_dir:
        description: "The target's environment directory in the caller's repository"
        type: string
        required: true
    secrets:
      SENTRY_DSN:
        description: "Sentry DSN for production topup preflight; inherited, or passed by a caller in another organisation"
        required: false
      TOPUP_MAINTENANCE_PRIVATE_KEY_PEM:
        description: "Ed25519 maintenance-only signing key PEM; required for topup upgrades, Environment protected"
        required: false
      PHALA_CLOUD_API_KEY:
        description: "The Phala Cloud API key of vars.PHALA_WORKSPACE: inherited from the Environment (secrets: inherit), or passed from a repository secret by a caller in another organisation"
        required: false

# The caller grants contents/attestations read for releases, actions read for rollback evidence.
permissions:
  contents: read
  attestations: read
  actions: read

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deployment per CVM at a time; a queued run never cancels one in progress.
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.target }}
      cancel-in-progress: false
    timeout-minutes: 75
    env:
      RELEASE_REPOSITORY: Phala-Network/phala-pay
      VERSION: ${{ inputs.version }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
      REQUESTED_VARIANT: ${{ inputs.variant }}
      MIGRATION_PLAN: ${{ inputs.migration_plan }}
      SOURCE_INFO_ARTIFACT: ${{ inputs.source_info_artifact }}
      TRANSACTION_HASH: ${{ inputs.transaction_hash }}
      INITIAL_GATEWAY_DOMAIN: ${{ inputs.gateway_domain }}
      ENVIRONMENT_DIR: ${{ inputs.environment_dir }}
      TOPUP_MAINTENANCE_KEY_ID: ${{ vars.TOPUP_MAINTENANCE_KEY_ID }}
      # The owner-approved OS image (architecture §14); preflight refuses any other.
      DSTACK_OS_IMAGE: dstack-0.6.1
      # Deployment state and the workspace preflight checks; not settings of the CVM.
      TOPUP_CVM_ID: ${{ vars.TOPUP_CVM_ID }}
      STAGING_PRODUCT_CVM_ID: ${{ vars.STAGING_PRODUCT_CVM_ID }}
      PHALA_WORKSPACE: ${{ vars.PHALA_WORKSPACE }}
      # Optional node pin for provision only; an upgrade keeps the CVM's node.
      PHALA_NODE_ID: ${{ vars.PHALA_NODE_ID }}
    steps:
      # Fixes the target's kit scripts and CVM for the later steps.
      - name: Check inputs and Environment settings
        timeout-minutes: 10
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          status=0
          [[ -n "$PHALA_CLOUD_API_KEY" ]] ||
            { echo "::error::PHALA_CLOUD_API_KEY is empty: a caller in the Phala-Network organisation passes 'secrets: inherit' with the key as the Environment's secret; a caller in another organisation passes PHALA_CLOUD_API_KEY from a repository secret (docs/self-hosting.md, step 5)"; status=1; }
          [[ -n "$PHALA_WORKSPACE" ]] ||
            { echo "::error::Environment variable PHALA_WORKSPACE is not set"; status=1; }
          [[ -z "$PHALA_NODE_ID" || "$PHALA_NODE_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::Environment variable PHALA_NODE_ID must be empty (auto) or digits"; status=1; }
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::version must be a release tag, v<semver>"; status=1; }
          [[ "$DEPLOY_ENVIRONMENT" == staging || "$DEPLOY_ENVIRONMENT" == production ]] ||
            { echo "::error::environment must be staging or production"; status=1; }
          [[ "$ENVIRONMENT_DIR" =~ ^[A-Za-z0-9._/-]+$ && "$ENVIRONMENT_DIR" != /* && "$ENVIRONMENT_DIR" != *..* ]] ||
            { echo "::error::environment_dir must be a relative path in the repository"; status=1; }
          kit="$RUNNER_TEMP/kit"
          case "$TARGET" in
            topup)
              preflight=$kit/deploy/preflight.sh variant=${REQUESTED_VARIANT:-service} cvm_id_variable=TOPUP_CVM_ID
              case "$variant" in
                service)
                  if [[ -n "${MIGRATION_PLAN:-}" ]]; then
                    [[ "$MODE" == upgrade ]] ||
                      { echo "::error::service migration_plan requires a Phala upgrade from export"; status=1; }
                    [[ "$MIGRATION_PLAN" =~ ^[A-Za-z0-9._/-]+$ && "$MIGRATION_PLAN" != /* && "$MIGRATION_PLAN" != *..* ]] ||
                      { echo "::error::migration_plan must be a reviewed relative JSON path"; status=1; }
                  fi ;;
                export | migration-import)
                  [[ "${MIGRATION_PLAN:-}" =~ ^[A-Za-z0-9._/-]+$ && "$MIGRATION_PLAN" != /* && "$MIGRATION_PLAN" != *..* ]] ||
                    { echo "::error::migration_plan must be a reviewed relative JSON path"; status=1; }
                  [[ "$variant" != export || "$MODE" == upgrade || "$MODE" == prepare || "$MODE" == commit ]] ||
                    { echo "::error::export requires an existing CVM"; status=1; } ;;
                *) echo "::error::unknown topup variant $variant"; status=1 ;;
              esac
              cvm_name=phala-pay-$DEPLOY_ENVIRONMENT instance_type=tdx.medium
              images="phala-pay postgres-walg" compose_name=docker-compose.$DEPLOY_ENVIRONMENT.yml ;;
            product)
              [[ "${REQUESTED_VARIANT:-service}" == service && -z "${MIGRATION_PLAN:-}" ]] ||
                { echo "::error::product takes no migration variant"; status=1; }
              [[ "$DEPLOY_ENVIRONMENT" == staging ]] ||
                { echo "::error::the reference product deploys to staging only"; status=1; }
              preflight=$kit/deploy/product/preflight.sh variant=product cvm_id_variable=STAGING_PRODUCT_CVM_ID
              cvm_name=phala-pay-staging-product instance_type=tdx.small
              images="phala-pay-reference-product phala-pay" compose_name=docker-compose.product.yml ;;
            *) echo "::error::unknown target $TARGET"; exit 1 ;;
          esac
          existing=${!cvm_id_variable}
          [[ "$variant" != export || -n "$existing" ]] ||
            { echo "::error::export requires an existing CVM"; status=1; }
          [[ "$variant" != migration-import || "$MODE" == prepare || "$MODE" == commit ]] ||
            { echo "::error::migration-import requires Base prepare/commit"; status=1; }
          # A new CVM's name is unique per run, since Phala Cloud refuses a duplicate name
          # (ERR-01-004): a reset provisions while the old CVM, stopped, stays for rollback. A CVM is
          # identified by its id variable, never by its name.
          {
            echo "KIT=$kit"
            echo "PREFLIGHT=$preflight"
            echo "VARIANT=$variant"
            echo "CVM_ID_VARIABLE=$cvm_id_variable"
            echo "EXISTING_CVM_ID=$existing"
            echo "CVM_NAME=$cvm_name-$GITHUB_RUN_ID"
            echo "INSTANCE_TYPE=$instance_type"
            echo "IMAGES=$images"
            echo "COMPOSE_NAME=$compose_name"
          } >>"$GITHUB_ENV"
          case "$MODE" in
            provision)
              [[ -z "$existing" ]] || {
                echo "::error::$cvm_id_variable is set ($existing); use mode upgrade, or clear it to provision a new CVM"
                status=1
              } ;;
            prepare | commit)
              if [[ "$MODE" == commit && ! "${TRANSACTION_HASH:-}" =~ ^(0x[0-9a-fA-F]{64}|already-registered)$ ]]; then
                echo "::error::commit requires transaction_hash (Base tx or already-registered)"; status=1
              fi ;;
            upgrade)
              [[ -n "$existing" ]] ||
                { echo "::error::mode upgrade needs the Environment variable $cvm_id_variable"; status=1; } ;;
            *) echo "::error::unknown mode $MODE"; status=1 ;;
          esac
          [[ -z "${SOURCE_INFO_ARTIFACT:-}" || "$SOURCE_INFO_ARTIFACT" =~ ^[0-9]+$ ]] ||
            { echo "::error::source_info_artifact must be an artifact ID"; status=1; }
          if [[ "$variant" == service && -n "${MIGRATION_PLAN:-}" && -z "${SOURCE_INFO_ARTIFACT:-}" ]]; then
            echo "::error::export rollback requires source_info_artifact from the export run"; status=1
          fi
          exit "$status"

      - name: Prepare private working files
        timeout-minutes: 10
        run: |
          work="$RUNNER_TEMP/deploy"
          mkdir -p "$work/release" "$KIT" "$RUNNER_TEMP/phala-cloud"
          env_file=$(umask 077 && mktemp "$RUNNER_TEMP/deploy-env.XXXXXX")
          {
            echo "WORK=$work"
            echo "ENV_FILE=$env_file"
            echo "PHALA_CLOUD_DIR=$RUNNER_TEMP/phala-cloud"
            echo "COMPOSE=$work/$COMPOSE_NAME"
          } >>"$GITHUB_ENV"

      # The GitHub CLI Deploy verifies with, pinned by its release checksum.
      - name: Install the GitHub CLI 2.101.0
        timeout-minutes: 10
        run: |
          version=2.101.0
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/cli/cli/releases/download/v$version/gh_${version}_linux_amd64.tar.gz"
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_amd64/bin" >>"$GITHUB_PATH"

      # deploy/verify-release.sh of this workflow's own commit verifies the release, whose commit
      # must then be this workflow's: the caller called Deploy at the release it deploys. The
      # workflow SHA is the commit for a caller that pins it, and the tag object for a caller at an
      # annotated tag; verify-release.sh peels the tag and accepts either.
      - name: Verify the release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == Phala-Network/phala-pay && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::Deploy must be Phala-Network/phala-pay's, called at a release"; exit 1; }
          # verify-release.sh and every script it sources (deploy/tests/release-tools.sh checks the list).
          for tool in verify-release.sh deadline.sh github-read.sh; do
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$WORKFLOW_REPOSITORY/contents/deploy/$tool?ref=$WORKFLOW_SHA" >"$WORK/$tool"
          done
          bash "$WORK/verify-release.sh" "$VERSION" "$WORK/release" "$WORKFLOW_SHA" >/dev/null ||
            { echo "::error::$VERSION did not verify, or Deploy is not called at its commit (the log above)"; exit 1; }
          tar -xzf "$WORK/release/phala-pay-deploy-$VERSION.tar.gz" -C "$KIT" --strip-components=1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the kit's locked Phala Cloud CLI
        timeout-minutes: 10
        run: npm ci --prefix "$KIT/deploy/tools" --ignore-scripts --no-audit --no-fund
      # cast, for preflight's chain checks.
      - name: Install Foundry
        timeout-minutes: 10
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3

      # The gateway of the CVM's node, the domain's CNAME target, which dstack-ingress names: from
      # the existing CVM on an upgrade; a new CVM is rendered with a provisional value until its
      # node is known (step "Set the values known only after provisioning").
      - name: Resolve the gateway
        timeout-minutes: 10
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          [[ -d "$ENVIRONMENT_DIR" ]] || {
            echo "::error::$ENVIRONMENT_DIR does not exist: commit this Environment's settings (docs/self-hosting.md)"
            exit 1
          }
          kms=phala
          [[ ! -f "$ENVIRONMENT_DIR/kms" ]] || kms=$(cat "$ENVIRONMENT_DIR/kms")
          case "$kms:$MODE" in
            phala:provision | phala:upgrade) ;;
            base:prepare | base:commit)
              [[ "$TARGET" == topup ]] || { echo "::error::Base KMS supports topup only"; exit 1; }
              [[ -s "$ENVIRONMENT_DIR/dstack-owner" ]] ||
                { echo "::error::Base KMS needs committed dstack-owner"; exit 1; }
              if [[ -z "$EXISTING_CVM_ID" ]]; then
                [[ -s "$ENVIRONMENT_DIR/provision.json" && "$INITIAL_GATEWAY_DOMAIN" =~ ^gateway\.[a-z0-9.-]+$ ]] ||
                  { echo "::error::Initial Base provision needs reviewed provision.json and gateway_domain"; exit 1; }
                if [[ "$MODE" == commit ]]; then
                  [[ -s "$ENVIRONMENT_DIR/dstack-app" ]] ||
                    { echo "::error::Commit the receipt's dstack-app address before initial commit"; exit 1; }
                fi
                echo "INITIAL_BASE=true" >>"$GITHUB_ENV"
              else
                [[ -s "$ENVIRONMENT_DIR/dstack-app" ]] ||
                  { echo "::error::Base upgrade needs committed dstack-app"; exit 1; }
              fi ;;
            *) echo "::error::kms must be phala (provision/upgrade) or base (prepare/commit)"; exit 1 ;;
          esac
          echo "KMS=$kms" >>"$GITHUB_ENV"
          if [[ "$MODE" == provision ]]; then
            gateway=gateway.pending.invalid
          elif [[ "$kms" == base && -z "$EXISTING_CVM_ID" ]]; then
            gateway=$INITIAL_GATEWAY_DOMAIN
          else
            "$KIT/deploy/phala-cvm.sh" get "$EXISTING_CVM_ID" >"$WORK/cvm-before.json"
            gateway=$("$KIT/deploy/phala-cvm.sh" gateway-domain "$WORK/cvm-before.json")
          fi
          echo "GATEWAY=$gateway" | tee -a "$GITHUB_ENV"

      - name: Render the environment with the release's kit and images
        timeout-minutes: 10
        run: |
          render_args=(--gateway-domain "$GATEWAY")
          domain_compose=$COMPOSE
          if [[ "$VARIANT" == export ]]; then
            render_args=(--export --migration-export "$MIGRATION_PLAN")
            domain_compose=$WORK/service-domain.yml
            "$KIT/deploy/render.sh" --images "$WORK/release/images.json" --gateway-domain "$GATEWAY" \
              "$ENVIRONMENT_DIR" >"$domain_compose"
          elif [[ "$VARIANT" == migration-import ]]; then
            render_args+=(--migration-import "$MIGRATION_PLAN")
          fi
          "$KIT/deploy/render.sh" --images "$WORK/release/images.json" "${render_args[@]}" \
            "$ENVIRONMENT_DIR" >"$COMPOSE"
          # Export retains the old service URL solely for the pre-fencing maintenance pause.
          # The public URL is the domain dstack-ingress serves.
          domain=$("$("$KIT/deploy/pinned-compose.sh")" -f "$domain_compose" config --no-interpolate --format json |
            jq -er '.services["dstack-ingress"].environment.DOMAIN')
          { echo "DOMAIN=$domain"; echo "PUBLIC_URL=https://$domain"; } | tee -a "$GITHUB_ENV"

      # The rendered compose's sealed names, all empty: the owner-sealed secrets. Database
      # credentials are not inputs: the CVM derives them from dstack KMS. `upgrade` writes the file
      # for preflight only and never sends it.
      - name: Write the unsealed env file
        timeout-minutes: 10
        run: |
          "$("$KIT/deploy/pinned-compose.sh")" -f "$COMPOSE" config --variables |
            awk 'NR > 1 && NF > 0 { print $1 "=" }' | sort >"$ENV_FILE"
          echo "sealed names: $(cut -d= -f1 "$ENV_FILE" | tr '\n' ' ')"

      # topup: each route's contracts and asset on every RPC provider it names, anonymous image
      # pulls. product: each chain's RPC reports its chain and the chain's treasury is a contract,
      # topup's attestation, anonymous pull. Both: the Phala Cloud workspace and OS image.
      - name: Preflight (read-only)
        timeout-minutes: 20
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sentry_args=()
          if [[ "$DEPLOY_ENVIRONMENT" == production && "$TARGET" == topup && "$VARIANT" != export ]]; then
            # This local preflight value is never sent to the CVM or printed.
            sed -i '/^SENTRY_DSN=/d' "$ENV_FILE"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >>"$ENV_FILE"
            sentry_args=(--require-sentry)
          fi
          variant_args=()
          if [[ "$VARIANT" == export ]]; then variant_args=(--export --migration-export "$MIGRATION_PLAN")
          elif [[ "$VARIANT" == migration-import ]]; then variant_args=(--migration-import "$MIGRATION_PLAN"); fi
          "$PREFLIGHT" --env "$ENV_FILE" --compose "$COMPOSE" --environment-dir "$ENVIRONMENT_DIR" \
            --workspace "$PHALA_WORKSPACE" --os-image "$DSTACK_OS_IMAGE" --unsealed "${sentry_args[@]}" "${variant_args[@]}"
          if [[ "$MODE" == upgrade || ( "$MODE" == commit && "${INITIAL_BASE:-false}" != true ) ]]; then
            REPO_ROOT=$KIT tmp=$WORK
            fail() { echo "::error::$*" >&2; }
            ok() { echo "ok: $*"; }
            source "$KIT/deploy/preflight-phala.sh"
            check_cvm_os_image "$EXISTING_CVM_ID" "$DSTACK_OS_IMAGE"
          fi

      # Every route's livemode must match its chain: production serves test mode on Sepolia beside
      # live mode on mainnet, staging test mode only. The check reads the routes as topup does, in
      # the image preflight pulled, and takes this run's Environment, never the configuration's own
      # name (deploy/check-route-modes.sh). Only topup's compose carries routes; the product
      # target is staging-only.
      - name: Check the routes' modes against the Environment
        timeout-minutes: 10
        if: inputs.target == 'topup' && inputs.variant != 'export'
        run: '"$KIT/deploy/check-route-modes.sh" "$DEPLOY_ENVIRONMENT" "$COMPOSE"'

      - name: Prepare the Base compose and Safe batches
        if: inputs.mode == 'prepare' || inputs.mode == 'commit'
        timeout-minutes: 10
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          policy=$(jq -cn -L "$KIT/deploy" --arg variant "$VARIANT" 'include "compose-policy"; port_policy($variant)')
          if [[ "${INITIAL_BASE:-false}" == true ]]; then
            jq --rawfile compose "$COMPOSE" --rawfile pre_launch "$KIT/deploy/phala-cloud-pre-launch.sh" \
              --argjson policy "$policy" '.compose_file.docker_compose_file = $compose |
              .compose_file.pre_launch_script = $pre_launch | .compose_file.port_policy = $policy' \
              "$ENVIRONMENT_DIR/provision.json" >"$WORK/provision-request.json"
            "$KIT/deploy/phala-cvm.sh" provision-prepare "$WORK/provision-request.json" \
              "$WORK/onchain-prepare.json" "$ENVIRONMENT_DIR"
            jq '{compose_hash, device_id, kms_info}' "$WORK/onchain-prepare.json" >"$WORK/onchain-prepare.json.summary.json"
          else
            "$KIT/deploy/phala-cvm.sh" compose-prepare "$EXISTING_CVM_ID" "$COMPOSE" \
              "$KIT/deploy/phala-cloud-pre-launch.sh" "$policy" "$WORK/onchain-prepare.json" "$ENVIRONMENT_DIR"
          fi
          {
            echo "### Base KMS preparation (no maintenance pause)"
            echo "Review the artifact's Safe batches, if present, on Base (8453). Already-approved hashes skip Cloud PATCH and need no compose batch."
            echo "Execute approval only after reviewing the prepare artifact, with no prepare or commit run for this app in progress."
            echo 'For an already-approved hash, commit with transaction_hash: already-registered (or the executed transaction hash); approve the device first if its batch is present.'
            echo "Commit reproduces the render, verifies approval before pausing, and applies it only after the pause."
            echo '```json'
            cat "$WORK/onchain-prepare.json.summary.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Verify Base approval before pausing
        if: inputs.mode == 'commit' && env.INITIAL_BASE != 'true'
        timeout-minutes: 10
        run: |
          hash=$(jq -er .compose_hash "$WORK/onchain-prepare.json")
          device=$(jq -er .device_id "$WORK/onchain-prepare.json")
          "$KIT/deploy/verify-onchain-app.sh" "$(cat "$ENVIRONMENT_DIR/dstack-app")" \
            "$(cat "$ENVIRONMENT_DIR/dstack-owner")" "$hash" "$device" >"$WORK/onchain-verification.json"
          if [[ "$TRANSACTION_HASH" != already-registered ]]; then
            node "$KIT/deploy/tools/onchain-kms.mjs" receipt "$TRANSACTION_HASH"
          fi
          # An OS upgrade is a separate approved operation. Do not introduce an unprepared reboot.
          [[ $(jq -er .os.name "$WORK/cvm-before.json") == "$DSTACK_OS_IMAGE" ]] ||
            { echo "::error::Base OS change needs a separately prepared operation; see onchain-kms-upgrade.md"; exit 1; }

      - name: Download the export guest Info for rollback
        if: inputs.mode == 'upgrade' && inputs.variant == 'service' && inputs.migration_plan != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${SOURCE_INFO_ARTIFACT:-}" =~ ^[0-9]+$ ]] ||
            { echo "::error::export rollback requires source_info_artifact"; exit 1; }
          timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_INFO_ARTIFACT" >"$WORK/source-artifact.json"
          jq -e --arg prefix "$DEPLOY_ENVIRONMENT-$TARGET-deploy-" \
            '.expired == false and (.name | startswith($prefix))' "$WORK/source-artifact.json" >/dev/null
          timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_INFO_ARTIFACT/zip" >"$WORK/source-artifact.zip"
          unzip -p "$WORK/source-artifact.zip" info.json >"$WORK/rollback-export-info.json"
          unzip -p "$WORK/source-artifact.zip" cvm.json >"$WORK/source-cvm.json"
          jq -e --slurpfile current "$WORK/cvm-before.json" '
            .vm_uuid != null and .vm_uuid == $current[0].vm_uuid
            and .app_id == $current[0].app_id and .os.name == $current[0].os.name
          ' "$WORK/source-cvm.json" >/dev/null
          rm "$WORK/source-artifact.zip"

      - name: Capture verified service Info before export
        if: inputs.variant == 'export' && inputs.mode != 'prepare'
        timeout-minutes: 20
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          [[ $(jq -er .os.name "$WORK/cvm-before.json") == "$DSTACK_OS_IMAGE" ]] ||
            { echo "::error::Export cannot change the OS image"; exit 1; }
          current=$(jq -er '.compose_hash | ascii_downcase | ltrimstr("0x")' "$WORK/cvm-before.json")
          app_id=$(jq -er .app_id "$WORK/cvm-before.json")
          "$KIT/deploy/phala-cvm.sh" attestation "$EXISTING_CVM_ID" "$current" >"$WORK/pre-export-attestation.json"
          curl -fsS --max-time 30 --retry 5 --retry-all-errors \
            "$PUBLIC_URL/v1/attestation/info" >"$WORK/info.json"
          "$KIT/deploy/verify-attestation.sh" "$WORK/pre-export-attestation.json" "$WORK/info.json" \
            "$app_id" "$WORK/service-domain.yml" service "$(cat "$ENVIRONMENT_DIR/os-image-hash")" \
            "$ENVIRONMENT_DIR" >"$WORK/pre-export-verification.txt"

      - name: Pause new mutations before upgrading
        id: maintenance
        if: (inputs.mode == 'upgrade' || inputs.mode == 'commit') && inputs.target == 'topup' && env.INITIAL_BASE != 'true'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          TOPUP_MAINTENANCE_PRIVATE_KEY_PEM: ${{ secrets.TOPUP_MAINTENANCE_PRIVATE_KEY_PEM }}
        run: |
          if [[ "$MODE" == commit ]] && jq -e '.no_op == true' "$WORK/onchain-prepare.json" >/dev/null; then
            "$KIT/deploy/phala-cvm.sh" get "$EXISTING_CVM_ID" >"$WORK/no-op-cvm.json"
            "$KIT/deploy/phala" api "/cvms/$EXISTING_CVM_ID/compose_file" >"$WORK/no-op-compose.json"
            node "$KIT/deploy/tools/onchain-kms.mjs" check-hash "$WORK/no-op-compose.json" "$WORK/onchain-prepare.json"
            node "$KIT/deploy/tools/onchain-kms.mjs" check-hash "$WORK/onchain-prepare.json.request.json" "$WORK/no-op-cvm.json"
            hash=$(jq -er .compose_hash "$WORK/onchain-prepare.json")
            device=$(jq -er .device_id "$WORK/onchain-prepare.json")
            "$KIT/deploy/verify-onchain-app.sh" "$(cat "$ENVIRONMENT_DIR/dstack-app")" \
              "$(cat "$ENVIRONMENT_DIR/dstack-owner")" "$hash" "$device" >"$WORK/no-op-onchain.json"
            jq -e '.in_progress == false and (.status == "running" or .status == "stopped")' "$WORK/no-op-cvm.json" >/dev/null ||
              { echo "::error::Unchanged CVM must be running or stopped with no operation in progress"; exit 1; }
            if jq -e '.status == "stopped"' "$WORK/no-op-cvm.json" >/dev/null; then
              cp "$WORK/no-op-cvm.json" "$WORK/stopped-no-op.json"
              echo "enabled=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "$MODE" == upgrade && "$VARIANT" == service && -n "${MIGRATION_PLAN:-}" ]]; then
            # The exporter has no API or ingress. Prove it is the reviewed, fenced compose
            # before skipping the pause; never send maintenance requests to a switched origin.
            [[ $(jq -er .os.name "$WORK/cvm-before.json") == "$DSTACK_OS_IMAGE" ]] ||
              { echo "::error::Export rollback cannot change the OS image; use the export's approved OS"; exit 1; }
            "$KIT/deploy/render.sh" --images "$WORK/release/images.json" --export \
              --migration-export "$MIGRATION_PLAN" "$ENVIRONMENT_DIR" >"$WORK/rollback-export.yml"
            current=$(jq -er '.compose_hash | ascii_downcase | ltrimstr("0x")' "$WORK/cvm-before.json")
            app_id=$(jq -er .app_id "$WORK/cvm-before.json")
            "$KIT/deploy/phala-cvm.sh" attestation "$EXISTING_CVM_ID" "$current" >"$WORK/rollback-export-attestation.json"
            test -s "$WORK/rollback-export-info.json" ||
              { echo "::error::download the export run's source_info_artifact before rollback"; exit 1; }
            "$KIT/deploy/verify-attestation.sh" "$WORK/rollback-export-attestation.json" \
              "$WORK/rollback-export-info.json" "$app_id" "$WORK/rollback-export.yml" export \
              "$(cat "$ENVIRONMENT_DIR/os-image-hash")" "$ENVIRONMENT_DIR" 2>&1 | tee "$WORK/rollback-export-verification.txt"
            echo "Verified the current export compose is fenced; no maintenance pause or resume. Routes remain paused; the operator resumes them through admin only after acceptance." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$KIT/deploy/instance-pause.sh" pause "$PUBLIC_URL" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >"$WORK/maintenance.json"
          # The response proves the lease was committed before any Phala Cloud upgrade call.
          jq -e '.paused_scopes == ["mutations"]' "$WORK/maintenance.json"
          echo "enabled=true" >>"$GITHUB_OUTPUT"
          echo "Mutation admission paused for at most 900 seconds; reads and in-flight work continue." >>"$GITHUB_STEP_SUMMARY"

      # The CLI output (JSON, no secrets: the key is only in the environment and env values are
      # encrypted client-side) goes to the log as well, so a failure shows its reason.
      - name: Deploy (${{ inputs.mode }}) and wait for the CVM
        if: inputs.mode != 'prepare'
        # OS-image change: <=15 min convergence + <=10 min health + a fresh lease;
        # compose: <=5 min submit + <=15 min convergence + <=10 min health.
        # These are ceilings, not outage promises; the job still has its 75-minute ceiling.
        timeout-minutes: 60
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          TOPUP_MAINTENANCE_PRIVATE_KEY_PEM: ${{ secrets.TOPUP_MAINTENANCE_PRIVATE_KEY_PEM }}
        run: |
          monitor_pid=""
          stop_monitor() {
            if [[ -n "$monitor_pid" ]]; then
              touch "$WORK/upgrade-monitor.stop"
              wait "$monitor_pid"
            fi
          }
          trap stop_monitor EXIT
          if [[ "$VARIANT" != export && ( "$MODE" == upgrade || ( "$MODE" == commit && "${INITIAL_BASE:-false}" != true ) ) ]]; then
            # Keep sampling through every reboot, bounded by this step's 60-minute budget.
            python3 "$KIT/deploy/upgrade-monitor.py" "$PUBLIC_URL" "$WORK/unavailability.json" "$WORK/upgrade-monitor.stop" 3600 &
            monitor_pid=$!
          fi
          if [[ "$MODE" == commit && "${INITIAL_BASE:-false}" == true ]]; then
            "$KIT/deploy/phala-cvm.sh" provision-commit "$TRANSACTION_HASH" "$WORK/onchain-prepare.json" \
              "$ENVIRONMENT_DIR" >"$WORK/deploy.json"
          elif [[ "$MODE" == provision ]]; then
            node_args=()
            [[ -z "$PHALA_NODE_ID" ]] || node_args=(--node-id "$PHALA_NODE_ID")
            "$KIT/deploy/phala-cvm.sh" deploy "$WORK/deploy.json" \
              "${node_args[@]}" \
              --name "$CVM_NAME" \
              --compose "$COMPOSE" \
              --pre-launch-script "$KIT/deploy/phala-cloud-pre-launch.sh" \
              -e "$ENV_FILE" \
              --instance-type "$INSTANCE_TYPE" \
              --fs ext4 \
              --kms phala \
              --image "$DSTACK_OS_IMAGE" \
              --no-dev-os \
              --no-public-logs \
              --no-public-sysinfo \
              --public-tcbinfo \
              --secure-time
          elif [[ "$MODE" == commit ]]; then
            cp "$WORK/onchain-prepare.json.summary.json" "$WORK/deploy.json"
            hash=$(jq -er .compose_hash "$WORK/deploy.json")
            "$KIT/deploy/phala-cvm.sh" compose-commit "$EXISTING_CVM_ID" "$hash" "$TRANSACTION_HASH" \
              "$WORK/onchain-prepare.json" "$ENVIRONMENT_DIR"
            if [[ -f "$WORK/stopped-no-op.json" ]]; then
              echo "no maintenance lease: CVM was stopped; started the already-stored approved compose" >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            current_image=$(jq -er '.os.name' "$WORK/cvm-before.json")
            if [[ "$current_image" != "$DSTACK_OS_IMAGE" ]]; then
              "$KIT/deploy/phala-cvm.sh" os-image "$EXISTING_CVM_ID" "$DSTACK_OS_IMAGE" >"$WORK/cvm-os-image.json"
              "$KIT/deploy/phala-cvm.sh" healthz "$PUBLIC_URL"
              if [[ "$TARGET" == topup ]]; then
                # The OS reboot discarded the old process's lease. Its old compose is now
                # serving normally; acquire a new lease immediately before the compose upgrade.
                "$KIT/deploy/instance-pause.sh" pause "$PUBLIC_URL" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >"$WORK/maintenance-compose.json"
                jq -e '.paused_scopes == ["mutations"]' "$WORK/maintenance-compose.json"
              fi
              echo "OS image upgraded from $current_image to $DSTACK_OS_IMAGE; old compose healthy before compose deployment. Topup takes a fresh 900-second lease for the second reboot." >>"$GITHUB_STEP_SUMMARY"
            fi
            policy=$(jq -cn -L "$KIT/deploy" --arg variant "$VARIANT" 'include "compose-policy"; port_policy($variant)')
            "$KIT/deploy/phala-cvm.sh" compose-update "$EXISTING_CVM_ID" "$COMPOSE" \
              "$KIT/deploy/phala-cloud-pre-launch.sh" "$policy" "$WORK/deploy.json"
          fi
          if [[ "$MODE" == provision || "${INITIAL_BASE:-false}" == true ]]; then
            cvm_id=$(jq -er '.vm_uuid // .id' "$WORK/deploy.json")
            app_id=$(jq -er '.app_id' "$WORK/deploy.json")
          else
            cvm_id=$EXISTING_CVM_ID
            app_id=$(jq -er '.app_id' "$WORK/cvm-before.json")
          fi
          {
            echo "CVM_ID=$cvm_id"
            echo "APP_ID=$app_id"
          } >>"$GITHUB_ENV"
          {
            echo "## $DEPLOY_ENVIRONMENT $TARGET $MODE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CVM id | \`$cvm_id\` |"
            echo "| App id | \`$app_id\` |"
            if [[ "$MODE" == provision ]]; then
              echo "| Requested node | \`${PHALA_NODE_ID:-auto}\` |"
            else
              echo "| Requested node | unchanged (upgrade) |"
            fi
            echo "| Release | $GITHUB_SERVER_URL/$RELEASE_REPOSITORY/releases/tag/$VERSION |"
            for name in $IMAGES; do
              echo "| $name | \`$(jq -r --arg name "$name" '.[$name]' "$WORK/release/images.json")\` |"
            done
            echo "| OS image | \`$DSTACK_OS_IMAGE\` |"
            echo "| Environment directory | \`$ENVIRONMENT_DIR\` at \`$GITHUB_SHA\` |"
            echo
            if [[ "$MODE" == provision ]]; then
              # Written now, so a later failure still leaves the id for recovery (mode upgrade).
              echo "Set the \`$DEPLOY_ENVIRONMENT\` Environment variable \`$CVM_ID_VARIABLE\` to \`$cvm_id\`;"
              echo "later runs, including a retry after a failure below, use mode \`upgrade\`."
              echo
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          # A provision only creates the CVM: unsealed, it boots but does not run, so it is waited for
          # settled in any status (deploy/phala-cvm.sh, wait); the attestation below shows it booted
          # the compose. The upgrade after the sealing is the acceptance step.
          if [[ "$VARIANT" == export ]]; then
            expected=$(jq -er '.compose_hash' "$WORK/deploy.json")
            "$KIT/deploy/phala-cvm.sh" wait --unsealed --compose-hash "$expected" "$cvm_id" >"$WORK/cvm.json"
          elif [[ "$MODE" == provision || "${INITIAL_BASE:-false}" == true ]]; then
            "$KIT/deploy/phala-cvm.sh" wait --unsealed "$cvm_id" >"$WORK/cvm.json"
          else
            expected=$(jq -er '.compose_hash' "$WORK/deploy.json")
            "$KIT/deploy/phala-cvm.sh" wait --compose-hash "$expected" "$cvm_id" >"$WORK/cvm.json"
          fi
          {
            echo "| | |"
            echo "|---|---|"
            echo "| CVM node | $(jq -r 'if .node_info.id != null then "\(.node_info.id) (\(.node_info.name), \(.node_info.region // "region not reported"))" else "not reported by Phala Cloud" end' "$WORK/cvm.json") |"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$VARIANT" != export && ( "$MODE" == upgrade || ( "$MODE" == commit && "${INITIAL_BASE:-false}" != true ) ) ]]; then
            # Keep sampling through boot and service readiness, before stopping the child process.
            "$KIT/deploy/phala-cvm.sh" healthz "$PUBLIC_URL"
          fi

      # A new CVM lands on the pinned node, or one chosen by Phala Cloud. Its gateway (the CNAME target, which
      # dstack-ingress names) is known only now, and is attested configuration: upgrade the new CVM
      # to the compose rendered with it and the explicit port policy, retaining the sealed env.
      # Still unsealed, it waits as the provision did.
      - name: Set the values known only after provisioning
        timeout-minutes: 25
        if: inputs.mode == 'provision'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          gateway=$("$KIT/deploy/phala-cvm.sh" gateway-domain "$WORK/cvm.json")
          "$KIT/deploy/render.sh" --images "$WORK/release/images.json" --gateway-domain "$gateway" \
            "$ENVIRONMENT_DIR" >"$COMPOSE"
          echo "GATEWAY=$gateway" | tee -a "$GITHUB_ENV"
          "$PREFLIGHT" --env "$ENV_FILE" --compose "$COMPOSE" --environment-dir "$ENVIRONMENT_DIR" \
            --offline --unsealed
          policy=$(jq -cn -L "$KIT/deploy" --arg variant "$VARIANT" 'include "compose-policy"; port_policy($variant)')
          "$KIT/deploy/phala-cvm.sh" compose-update "$CVM_ID" "$COMPOSE" \
            "$KIT/deploy/phala-cloud-pre-launch.sh" "$policy" "$WORK/deploy-public-url.json"
          expected=$(jq -er '.compose_hash' "$WORK/deploy-public-url.json")
          "$KIT/deploy/phala-cvm.sh" wait --unsealed --compose-hash "$expected" "$CVM_ID" >"$WORK/cvm.json"

      # After an upgrade the attestation can still describe the previous compose for a while.
      - name: Read back and verify the attested compose
        if: inputs.mode != 'prepare'
        timeout-minutes: 20
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          deployed=$(jq -er '.compose_hash | ascii_downcase | ltrimstr("0x")' "$WORK/cvm.json")
          if [[ "$MODE" == commit && "${INITIAL_BASE:-false}" != true ]]; then
            "$KIT/deploy/phala" api "/cvms/$CVM_ID/compose_file" >"$WORK/committed-compose.json"
            node "$KIT/deploy/tools/onchain-kms.mjs" check-hash "$WORK/committed-compose.json" "$WORK/onchain-prepare.json"
          fi
          "$KIT/deploy/phala-cvm.sh" attestation "$CVM_ID" "$deployed" >"$WORK/attestation.json"
          if [[ "$MODE" == provision || "${INITIAL_BASE:-false}" == true ]]; then
            "$KIT/deploy/verify-attestation.sh" --partial "$WORK/attestation.json" - "$APP_ID" \
              "$COMPOSE" "$VARIANT" "$(cat "$ENVIRONMENT_DIR/os-image-hash")" "$ENVIRONMENT_DIR" \
              2>&1 | tee "$WORK/partial-verification.txt" >>"$GITHUB_STEP_SUMMARY"
            echo "Acceptance pending: seal the CVM, configure DNS, then run upgrade readback. Migration-import: verify import-info.json and recipient evidence from the migration prefix before export." | tee "$WORK/acceptance-pending.txt" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Export has no ingress: reuse this run's verified pre-upgrade service Info.
          # vm_config must still verify against the new quote; OS changes were refused.
          if [[ "$VARIANT" != export ]]; then
            curl -fsS --max-time 30 --retry 5 --retry-all-errors \
              "$PUBLIC_URL/v1/attestation/info" >"$WORK/info.json"
          fi
          # Apply the reviewed OS pin on provision and upgrade, including existing CVMs.
          expected_os_hash=$(cat "$ENVIRONMENT_DIR/os-image-hash")
          "$KIT/deploy/verify-attestation.sh" "$WORK/attestation.json" "$WORK/info.json" "$APP_ID" \
            "$COMPOSE" "$VARIANT" "$expected_os_hash" "$ENVIRONMENT_DIR" 2>&1 | tee "$WORK/verification.txt"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Compose hash | \`0x$deployed\` |"
            echo "| Public URL | $PUBLIC_URL |"
            if [[ "$TARGET" == product ]]; then
              echo "| Webhook URL | $PUBLIC_URL/webhooks |"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # tls-alpn-01 (dstack-ingress README, "Certificates without DNS credentials"): the TXT record
      # names the instance, from the event log the verifier replayed, so the gateway routes the
      # domain to this CVM alone; dstack-ingress requests the certificate only once both records
      # resolve. An upgrade keeps the instance id; a new instance (a restore) needs a new TXT value.
      - name: Print the owner's DNS records
        if: inputs.mode != 'prepare' && inputs.variant != 'export'
        timeout-minutes: 10
        run: |
          instance_id=$("$KIT/deploy/phala-cvm.sh" instance-id "$WORK/attestation.json")
          {
            echo "### Owner: DNS records for \`$DOMAIN\`"
            echo
            echo "In the domain's DNS zone, not proxied (Cloudflare: DNS only); keep them unchanged while"
            echo "this instance serves the domain:"
            echo
            echo "| Type | Name | Content |"
            echo "|---|---|---|"
            echo "| CNAME | \`$DOMAIN\` | \`$GATEWAY\` |"
            echo "| TXT | \`_dstack-app-address.$DOMAIN\` | \`$instance_id:443\` |"
            echo
            echo "Optional, once the certificate is issued: CAA \`$DOMAIN\`"
            echo "\`0 issue \"letsencrypt.org;validationmethods=tls-alpn-01;accounturi=<ACME account>\"\`, with"
            echo "the account that \`deploy/verify-ingress-evidence.sh $DOMAIN $APP_ID\` prints."
          } >>"$GITHUB_STEP_SUMMARY"

      # A new CVM answers on its domain only with the records above in place and the certificate
      # issued (curl verifies it), and a new topup CVM's PostgreSQL cannot list the backup prefix
      # until the owner seals the storage credentials, so the first check is the upgrade's.
      - name: Wait for the service
        timeout-minutes: 20
        if: (inputs.mode == 'upgrade' || inputs.mode == 'commit') && env.INITIAL_BASE != 'true' && inputs.variant != 'export'
        run: '"$KIT/deploy/phala-cvm.sh" healthz "$PUBLIC_URL"'

      - name: Resume mutations after health checks
        if: steps.maintenance.outputs.enabled == 'true' && inputs.variant != 'export'
        env:
          TOPUP_MAINTENANCE_PRIVATE_KEY_PEM: ${{ secrets.TOPUP_MAINTENANCE_PRIVATE_KEY_PEM }}
        run: |
          "$KIT/deploy/instance-pause.sh" resume "$PUBLIC_URL" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >"$WORK/maintenance-cleared.json"
          jq -e '.paused_scopes == []' "$WORK/maintenance-cleared.json"

      # Right after a DNS change the domain can still reach the previous instance, from a resolver's
      # cache, or the new one can still be obtaining its certificate: retried every 30 seconds for
      # at most 10 minutes in all (each check bounds its own requests and TLS handshake).
      - name: Verify the certificate evidence
        timeout-minutes: 10
        if: (inputs.mode == 'upgrade' || inputs.mode == 'commit') && env.INITIAL_BASE != 'true' && inputs.variant != 'export'
        run: |
          # shellcheck disable=SC2016  # expanded by the inner bash
          if ! timeout 600 bash -c 'until "$0" "$1" "$2" >"$3" 2>&1; do cat "$3"; sleep 30; done' \
            "$KIT/deploy/verify-ingress-evidence.sh" "$DOMAIN" "$APP_ID" "$WORK/ingress-evidence.txt"; then
            cat "$WORK/ingress-evidence.txt"
            echo "::error::the certificate evidence of $DOMAIN did not verify within 10 minutes"
            exit 1
          fi
          cat "$WORK/ingress-evidence.txt"
          { echo '```text'; cat "$WORK/ingress-evidence.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      - name: Print the owner's sealing step
        timeout-minutes: 10
        if: inputs.mode == 'provision' || (inputs.mode == 'commit' && env.INITIAL_BASE == 'true')
        run: |
          compose_json=$("$("$KIT/deploy/pinned-compose.sh")" -f "$COMPOSE" config --no-interpolate --format json)
          names=$(cut -d= -f1 "$ENV_FILE" | awk '{ printf "%s`%s`", (count++ ? ", " : ""), $0 }')
          kit_preflight=kit/${PREFLIGHT#"$KIT/"}
          {
            if [[ "$TARGET" == topup ]]; then
              owner_env=.env.$DEPLOY_ENVIRONMENT
              image=$(jq -r '.services.topup.image' <<<"$compose_json")
              echo "### Owner: seal the runtime secrets"
              echo
              echo "This provision created the CVM and proves nothing about its health. The CVM waits for"
              echo "its storage credentials: PostgreSQL refuses to initialize until it can list the backup"
              echo "prefix, so Phala Cloud shows the CVM as \`error\` until it is sealed. From your own machine,"
              echo "write \`$owner_env\` (mode 0600) with exactly the compose's sealed names: $names."
              echo "\`SENTRY_DSN\` may be empty; each \`TOPUP_RPC_<ID>_KEY\` is the key for the \`{key}\`"
              echo "in provider <ID>'s URL, empty for a keyless URL. The same name set keeps the compose hash."
            else
              owner_env=.env.product
              image=$(jq -r '.services.product.image' <<<"$compose_json")
              echo "### Owner: seal the product's API key"
              echo
              echo "The product runs without its Phala Pay key: webhooks and fulfillment are served,"
              echo "the account API answers 503. From your own machine, write \`$owner_env\` with the"
              echo "single line \`PRODUCT_API_KEY=<the account's restricted ppay_rk_test_ key>\` (mode 0600)."
            fi
            echo "In a checkout of \`$GITHUB_SHA\`, with \`$COMPOSE_NAME\` from this run's artifact and the"
            echo "release's kit in \`kit/\` (docs/self-hosting.md, \"Verify a release\"; preflight --offline"
            echo "checks the configuration in the pinned image, pulled first):"
            echo
            echo '```sh'
            echo "npm ci --prefix kit/deploy/tools --ignore-scripts"
            echo "docker pull $image"
            echo "$kit_preflight --env $owner_env --compose $COMPOSE_NAME --environment-dir $ENVIRONMENT_DIR --offline"
            echo "kit/deploy/phala envs update $CVM_ID -e $owner_env"
            echo '```'
            if [[ "$TARGET" == topup ]]; then
              prefix=$(jq -r '.services.postgres.environment.WALG_S3_PREFIX' <<<"$compose_json")
              endpoint=$(jq -r '.services.postgres.environment.AWS_ENDPOINT' <<<"$compose_json")
              echo
              echo "The service answers $PUBLIC_URL/healthz once the CVM has restarted with the"
              echo "secrets and the DNS records above resolve, and backups have started when the"
              echo "newest archived WAL segment is younger than two minutes:"
              echo
              echo '```sh'
              echo "aws s3 ls \"${prefix%/}/wal_005/\" --endpoint-url \"$endpoint\" | tail -1"
              echo '```'
            fi
            echo
            echo "**Acceptance:** once sealed and the DNS records resolve, dispatch Deploy with mode"
            echo "\`upgrade\`. It requires the CVM running, \`/healthz\`, the attested compose, and the"
            echo "certificate evidence; full OS/vm_config verification and service acceptance remain pending until it passes."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Clear maintenance after a failed upgrade
        if: failure() && steps.maintenance.outputs.enabled == 'true'
        env:
          TOPUP_MAINTENANCE_PRIVATE_KEY_PEM: ${{ secrets.TOPUP_MAINTENANCE_PRIVATE_KEY_PEM }}
        run: |
          if ! "$KIT/deploy/instance-pause.sh" resume "$PUBLIC_URL" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >"$WORK/maintenance-cleared.json"; then
            echo "::warning::Maintenance clear could not reach the service; the 900-second lease expires automatically. See deploy/runbooks/instance-maintenance.md."
          fi

      - name: Report observed unavailability
        if: always() && (inputs.mode == 'upgrade' || inputs.mode == 'commit') && inputs.variant != 'export'
        run: |
          if [[ -f "$WORK/unavailability.json" ]]; then
            python3 "$KIT/deploy/upgrade-monitor.py" summary "$WORK/unavailability.json" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Upgrade availability was not sampled: deployment did not start." >>"$GITHUB_STEP_SUMMARY"
          fi

      # No secrets: the compose holds the public settings and references to the sealed secrets,
      # and the CLI outputs hold ids, hashes, and the attested app-compose.
      - name: Upload the deployment record
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.environment }}-${{ inputs.target }}-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/deploy/docker-compose.*.yml
            ${{ runner.temp }}/deploy/release/images.json
            ${{ runner.temp }}/deploy/onchain-prepare.json.batch.json
            ${{ runner.temp }}/deploy/onchain-prepare.json.device-batch.json
            ${{ runner.temp }}/deploy/onchain-prepare.json.summary.json
            ${{ runner.temp }}/deploy/onchain-verification.json
            ${{ runner.temp }}/deploy/deploy.json
            ${{ runner.temp }}/deploy/deploy-public-url.json
            ${{ runner.temp }}/deploy/cvm.json
            ${{ runner.temp }}/deploy/attestation.json
            ${{ runner.temp }}/deploy/info.json
            ${{ runner.temp }}/deploy/acceptance-pending.txt
            ${{ runner.temp }}/deploy/partial-verification.txt
            ${{ runner.temp }}/deploy/pre-export-attestation.json
            ${{ runner.temp }}/deploy/pre-export-verification.txt
            ${{ runner.temp }}/deploy/source-artifact.json
            ${{ runner.temp }}/deploy/source-cvm.json
            ${{ runner.temp }}/deploy/verification.txt
            ${{ runner.temp }}/deploy/rollback-export.yml
            ${{ runner.temp }}/deploy/rollback-export-attestation.json
            ${{ runner.temp }}/deploy/rollback-export-info.json
            ${{ runner.temp }}/deploy/rollback-export-verification.txt
            ${{ runner.temp }}/deploy/ingress-evidence.txt
            ${{ runner.temp }}/deploy/unavailability.json
            ${{ runner.temp }}/deploy/maintenance.json
            ${{ runner.temp }}/deploy/maintenance-cleared.json

      - name: Delete the env file, the kit, and CLI state
        timeout-minutes: 10
        if: always()
        run: |
          [[ -z "${ENV_FILE:-}" ]] || rm -f "$ENV_FILE" "$ENV_FILE.new"
          [[ -z "${PHALA_CLOUD_DIR:-}" ]] || rm -rf "$PHALA_CLOUD_DIR"
          [[ -z "${WORK:-}" ]] || rm -rf "$WORK"
          [[ -z "${KIT:-}" ]] || rm -rf "$KIT"
