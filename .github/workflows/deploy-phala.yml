name: Deploy Phala's instance

# Phala's own deployments (deploy/phala.md), exactly as an operator's: Deploy called at the release
# Phala runs, with this repository's committed environment directory
# deploy/environments/phala-network/<Environment>/<target>. Adopting a new release is a pull
# request that changes the release in both places below. Dispatched from main by a user with write
# access; see deploy.yml for what a run checks and does.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      target:
        description: "topup: the service CVM (vars.TOPUP_CVM_ID); product: the staging reference-product CVM (vars.STAGING_PRODUCT_CVM_ID)"
        type: choice
        options: [topup, product]
        required: true
      mode:
        description: "provision/upgrade (kms phala); prepare/commit (kms base, onchain approval)"
        type: choice
        options: [provision, upgrade, prepare, commit]
        required: true
      variant:
        description: "service, export, or migration-import (onchain KMS migration)"
        type: choice
        options: [service, export, migration-import]
        default: service
      migration_plan:
        description: "Reviewed migration JSON path in this repository (export, import, or rollback from export)"
        type: string
        default: ""
      environment_dir:
        description: "Reviewed environment directory; empty selects deploy/environments/phala-network/<environment>/<target>"
        type: string
        default: ""
      transaction_hash:
        description: "Executed Base Safe transaction hash, or already-registered (commit mode)"
        type: string
        default: ""
      gateway_domain:
        description: "Pinned node gateway host for an initial Base provision"
        type: string
        default: ""
      source_info_artifact:
        description: "Export run's deployment artifact ID (rollback from export only)"
        type: string
        default: ""

permissions:
  contents: read
  attestations: read
  # The release's Deploy reads a prior run's artifact for rollback from export.
  actions: read

jobs:
  deploy:
    uses: Phala-Network/phala-pay/.github/workflows/deploy.yml@6fef9ecbb910a490644f5b7847498d089cb8397a # v0.13.11
    with:
      version: v0.13.11
      environment: ${{ inputs.environment }}
      target: ${{ inputs.target }}
      mode: ${{ inputs.mode }}
      variant: ${{ inputs.variant }}
      migration_plan: ${{ inputs.migration_plan }}
      transaction_hash: ${{ inputs.transaction_hash }}
      gateway_domain: ${{ inputs.gateway_domain }}
      source_info_artifact: ${{ inputs.source_info_artifact }}
      environment_dir: ${{ inputs.environment_dir || format('deploy/environments/phala-network/{0}/{1}', inputs.environment, inputs.target) }}
    # The called job's Environment secret (PHALA_CLOUD_API_KEY) resolves only when the caller
    # inherits secrets (actions/runner#4453); this repository holds no other secret.
    secrets: inherit
