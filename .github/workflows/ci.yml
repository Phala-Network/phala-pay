name: CI

# The merge queue runs it on each queued merge (merge_group); Release calls it too (workflow_call),
# on the tagged commit, before it builds anything.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

# Jobs run in parallel on GitHub-hosted runners; a new push to a PR supersedes its previous run.
# Pushes to main queue instead, so every merge keeps a complete CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Format, clippy with all and with default features, and cargo-deny
        run: make lint

  # The service and both SDKs share one version, the Cargo workspace version (CONTRIBUTING.md,
  # "Releasing").
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The SDKs name the Cargo workspace version
        run: scripts/version.sh
      - name: Check that scripts/version.sh catches a drifted version
        run: scripts/tests/version.sh

  # Every Markdown file, linted with .markdownlint-cli2.jsonc, and its relative links and anchors
  # checked offline with lychee.toml (CONTRIBUTING.md, "Documentation").
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Check the documentation's links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress .
          jobSummary: false

  # The whole workspace once, with PostgreSQL and Foundry. The database and Anvil test helpers fail
  # instead of skipping when CI=true (set by Actions). The dstack simulator test still skips by
  # design: no simulator runs here.
  test:
    runs-on: ubuntu-latest
    env:
      # The test harness's database owner and application login (crates/topup/tests/support).
      OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://topup_ci:topup_ci@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/rust
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: DATABASE_URL="$OWNER_DATABASE_URL" cargo run --locked -p topup -- migrate
      - name: Create application login role
        run: >-
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE topup_ci LOGIN PASSWORD 'topup_ci' IN ROLE topup_app"
      - name: Check SQLx offline metadata
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Test the workspace on Anvil and PostgreSQL
        run: cargo test --workspace --locked --all-features -- --nocapture

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Install the locked SDK environment
        run: make -C sdk/python sync
      - name: Lint, type-check, test, and check that client regeneration is a no-op
        run: make -C sdk/python check

  sdk-js:
    needs: sdk-js-react18
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the React 18 floor job to pass
        working-directory: .
        env:
          FLOOR_RESULT: ${{ needs.sdk-js-react18.result }}
        run: |
          if [[ "$FLOOR_RESULT" != "success" ]]; then
            echo "sdk-js-react18 finished with '$FLOOR_RESULT'; refusing to run the default SDK check" >&2
            exit 1
          fi
      - uses: ./.github/actions/sdk-js
      - name: Typecheck, lint, unit tests, and build
        run: pnpm run check
      # The API reference published from main (.github/workflows/api-reference.yml) builds.
      - name: Build the API reference
        working-directory: docs/reference
        env:
          REDOCLY_TELEMETRY: "off"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # Chromium runs in Playwright's image: the runner lacks its system libraries.
      - name: End-to-end tests on Anvil
        run: pnpm run e2e:docker
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-js-playwright-report
          path: |
            sdk/js/playwright-report
            sdk/js/test-results
          retention-days: 7

  # Keep the advertised React 18 floor covered independently of the default React 19 toolchain.
  # The exact versions are intentional: this job verifies the SDK's peer range at its lower bound.
  sdk-js-react18:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-js
        with:
          e2e: "true"
      - name: Install the pinned React 18 floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
          Object.assign(packageJson.devDependencies, {
            react: '18.2.0',
            'react-dom': '18.2.0',
            '@types/react': '18.3.31',
            '@types/react-dom': '18.3.7',
          });
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          pnpm install --no-frozen-lockfile
      - name: Typecheck, unit tests, and build on React 18
        run: pnpm run check
      - name: Browser tests on React 18
        run: pnpm run e2e:docker
      - name: Keep the React 18 Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-js-react18-playwright-report
          path: |
            sdk/js/playwright-report
            sdk/js/test-results
          retention-days: 7

  # The Phala Pay website (deploy/product/web), served from its own origin as Cloudflare serves it,
  # and its demo calling the reference product's API cross-origin, end to end on Anvil against a
  # stand-in service (deploy/product/web/e2e/fake_service.py).
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The e2e deploys the real ForwarderFactory, which needs only OpenZeppelin to build.
      - name: Fetch the contracts' OpenZeppelin dependency
        run: git submodule update --init --depth 1 contracts/lib/openzeppelin-contracts
      - uses: ./.github/actions/sdk-js
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Install the locked Python environment
        run: make -C sdk/python sync
      - name: Build the SDK the page depends on
        working-directory: sdk/js
        run: pnpm run build
      - name: Install the page's locked dependencies
        working-directory: deploy/product/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, and build the page
        working-directory: deploy/product/web
        run: pnpm run check
      # What Workers Builds deploys (deploy/phala.md, "Website"): the config and the Build Output
      # that `pnpm run check` built, as `cf deploy --prebuilt` uploads them.
      - name: Check the Cloudflare config without deploying
        working-directory: deploy/product/web
        env:
          CF_SEND_TELEMETRY: "false"
        run: pnpm exec cf deploy --prebuilt --dry-run
      # Chromium runs in Playwright's image: the runner lacks its system libraries.
      - name: End-to-end tests on Anvil
        working-directory: deploy/product/web
        run: pnpm run e2e:docker
      - name: Keep the Playwright report and service logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-playwright-report
          path: |
            deploy/product/web/playwright-report
            deploy/product/web/test-results
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        directory: [sdk/js, deploy/product/web, sdk/python, docs/reference, deploy/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/security
        with:
          scan-ref: ${{ matrix.directory }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Analyze production contracts
        working-directory: contracts
        run: uvx --from slither-analyzer==0.11.6 slither . --filter-paths 'lib/|test/|script/' --exclude-dependencies --fail-pedantic

  cvm-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      # These disposable rehearsal images use a fixed epoch so documentation-only commits can
      # reuse compiled layers. Release's clean rebuild comparison uses the commit timestamp.
      - name: Build phala-pay with cached layers
        id: cached-build-1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: phala-pay:rehearsal
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-phala-pay
          cache-to: type=gha,scope=ci-phala-pay,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-1.outcome == 'failure'
        env:
          BUILD_FILE: Dockerfile
          BUILD_TAG: phala-pay:rehearsal
        run: &cold-cache-fallback |
          set -euo pipefail
          record=$(mktemp)
          trap 'unlink "$record"' EXIT
          # Inspect the terminal error, not unrelated cache warnings in compiler logs.
          docker buildx history inspect --format json > "$record"
          python3 - "$record" "$BUILD_FILE" <<'PYCODE'
          import json, re, sys
          record = json.load(open(sys.argv[1]))
          error = (record.get("Error") or {}).get("Message", "")
          cache = re.search(r"actions-cache/|results-receiver\.actions\.githubusercontent\.com|artifactcache\.actions\.githubusercontent\.com", error, re.I)
          transport = re.search(r"BlobNotFound|\b(?:404|408|429|5[0-9]{2})\b|timeout|timed out|unexpected EOF|connection (?:reset|refused)|TLS handshake", error, re.I)
          if record.get("Status") != "failed" or not record.get("Dockerfile", "").endswith(sys.argv[2]) or not (cache and transport):
              print("::error::Build failure is not a recognized cache transport failure; no retry")
              sys.exit(1)
          print("::warning::Cache transport failed; retrying once without cached layers or cache import/export")
          PYCODE
          docker buildx build --progress=plain --no-cache --load \
            --file "$BUILD_FILE" --tag "$BUILD_TAG" --build-arg SOURCE_DATE_EPOCH=0 .
      - name: Build postgres-walg with cached layers
        id: cached-build-2
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.postgres-walg
          load: true
          tags: postgres-walg:rehearsal
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-postgres-walg
          cache-to: type=gha,scope=ci-postgres-walg,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-2.outcome == 'failure'
        env:
          BUILD_FILE: deploy/Dockerfile.postgres-walg
          BUILD_TAG: postgres-walg:rehearsal
        run: *cold-cache-fallback
      - name: Build phala-pay-reference-product with cached layers
        id: cached-build-3
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.reference-product
          load: true
          tags: phala-pay-reference-product:rehearsal
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-phala-pay-reference-product
          cache-to: type=gha,scope=ci-phala-pay-reference-product,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-3.outcome == 'failure'
        env:
          BUILD_FILE: deploy/Dockerfile.reference-product
          BUILD_TAG: phala-pay-reference-product:rehearsal
        run: *cold-cache-fallback
      - name: Build phala-pay-dstack-simulator with cached layers
        id: cached-build-4
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/local/Dockerfile.dstack-simulator
          load: true
          tags: phala-pay-dstack-simulator:rehearsal
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-phala-pay-dstack-simulator
          cache-to: type=gha,scope=ci-phala-pay-dstack-simulator,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-4.outcome == 'failure'
        env:
          BUILD_FILE: deploy/local/Dockerfile.dstack-simulator
          BUILD_TAG: phala-pay-dstack-simulator:rehearsal
        run: *cold-cache-fallback
      - name: Rehearse a payment and signed webhook redelivery
        env:
          REHEARSAL_PREBUILT: "1"
        run: make cvm-rehearsal

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Build phala-pay
        id: cached-build-5
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: phala-pay:ci
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-phala-pay
          cache-to: type=gha,scope=ci-phala-pay,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-5.outcome == 'failure'
        env:
          BUILD_FILE: Dockerfile
          BUILD_TAG: phala-pay:ci
        run: *cold-cache-fallback
      - name: Smoke test runtime image
        run: docker run --rm phala-pay:ci topup --help
      - name: The webhook egress proxy refuses private, CGNAT, and IPv4-mapped targets
        run: deploy/tests/smokescreen.sh phala-pay:ci
      - name: Build phala-pay-reference-product
        id: cached-build-6
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.reference-product
          load: true
          tags: phala-pay-reference-product:ci
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-phala-pay-reference-product
          cache-to: type=gha,scope=ci-phala-pay-reference-product,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-6.outcome == 'failure'
        env:
          BUILD_FILE: deploy/Dockerfile.reference-product
          BUILD_TAG: phala-pay-reference-product:ci
        run: *cold-cache-fallback
      - name: Smoke test the reference-product image
        run: docker run --rm phala-pay-reference-product:ci --help
      - uses: ./.github/actions/security
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: phala-pay:ci
      - uses: ./.github/actions/security
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: phala-pay-reference-product:ci
      # Release publishes only after two matching builds; catch a nondeterministic
      # dependency here rather than at release. The phala-pay build is too slow to repeat per PR.
      - name: Check the reference-product image is reproducible
        env:
          DOCKERFILE: deploy/Dockerfile.reference-product
          TMPDIR: ${{ runner.temp }}
        run: deploy/verify-image.sh
      - name: Validate the sandbox route template
        run: |
          route="$RUNNER_TEMP/sandbox-route.yaml"
          FORWARDER_FACTORY=0x0000000000000000000000000000000000000000 \
          TEST_TOKEN=0x1111111111111111111111111111111111111111 \
          SANCTIONS_ORACLE=0x2222222222222222222222222222222222222222 \
          PRODUCT_SLUG=ci-check \
            deploy/sandbox/render-route.sh >"$route"
          docker run --rm -i phala-pay:ci \
            topup route validate --template /dev/stdin <"$route"

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the attested compose and the local, sandbox, and restore-drill overlays
        run: deploy/validate-compose.sh
      - name: Create and recreate rendered compose config consumers with Docker
        timeout-minutes: 5
        run: deploy/tests/compose-startup.sh
      # Every tracked file with a shell shebang, with .shellcheckrc, but Phala Cloud's pre-launch
      # script, kept byte for byte as attested; streamed into the container, since the runner's
      # Docker daemon cannot bind-mount the workspace.
      - name: ShellCheck the shell scripts
        shell: bash
        env:
          SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
        run: |
          mapfile -t scripts < <(git grep -lz '^#!.*sh$' -- ':!deploy/phala-cloud-pre-launch.sh' | xargs -0 awk 'FNR == 1 { if (/^#!.*sh$/) print FILENAME; nextfile }')
          tar -cf - .shellcheckrc "${scripts[@]}" |
            docker run --rm -i "$SHELLCHECK_IMAGE" sh -c 'mkdir /src && cd /src && tar -x && shellcheck "$@"' sh "${scripts[@]}"
      - name: Validate deployment scripts
        run: |
          deploy/tests/walg-restore.sh
          deploy/tests/render.sh
          deploy/tests/render-route.sh
          deploy/tests/verify-release.sh
          python3 .github/security/test-exceptions.py
          deploy/tests/phala-cvm-wait.sh
          deploy/tests/attested-compose.sh
          deploy/tests/verify-ingress-evidence.sh
          deploy/tests/preflight-phala.sh
          deploy/tests/verification-diagnostics.sh
          deploy/tests/product-preflight.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile deploy/local/mock-product.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The env file convention against the locked Phala Cloud CLI's own parser.
      - name: Check the env file round trip
        run: deploy/tests/env-file.sh
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-runbooks-${{ hashFiles('**/Cargo.lock') }}
      # Preflight and the route-mode check read the configuration with topup; in CI, this build's.
      # The deploy kit is built from this commit and used outside the checkout, as an operator does,
      # and so is the one-command deploy, against stub GitHub, Phala Cloud, and registry tools.
      - name: Check preflight's local checks, the route-mode check, the deploy kit, and deploy.sh
        run: |
          cargo build --locked -q -p topup
          TOPUP="$PWD/target/debug/topup" deploy/tests/preflight.sh
          TOPUP="$PWD/target/debug/topup" deploy/tests/check-route-modes.sh
          TOPUP="$PWD/target/debug/topup" deploy/tests/kit.sh
          TOPUP="$PWD/target/debug/topup" deploy/tests/deploy.sh
      - name: Check runbook commands against the CLI and OpenAPI
        run: make runbook-check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Build postgres-walg
        id: cached-build-7
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.postgres-walg
          load: true
          tags: postgres-walg:ci
          build-args: SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=ci-postgres-walg
          cache-to: type=gha,scope=ci-postgres-walg,mode=max,ignore-error=true
      - name: Cold build only after cache transport failure
        if: steps.cached-build-7.outcome == 'failure'
        env:
          BUILD_FILE: deploy/Dockerfile.postgres-walg
          BUILD_TAG: postgres-walg:ci
        run: *cold-cache-fallback
      - uses: ./.github/actions/security
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: postgres-walg:ci
      - name: Check WAL-G runtime
        run: docker run --rm postgres-walg:ci wal-g --version
      - name: postgres-walg carries TLS roots for the object store
        run: docker run --rm --entrypoint sh postgres-walg:ci -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - name: Check walg-cron and its backup-age marker
        run: deploy/tests/walg-cron.sh postgres-walg:ci
      - name: Check the PostgreSQL bootstrap and WAL archive switch
        run: deploy/tests/walg-archive-switch.sh postgres-walg:ci

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Test contracts
        working-directory: contracts
        run: forge test
      - name: Check deterministic deployment
        run: |
          deploy/contracts/check-build.sh --check
          deploy/contracts/reference-manifest.sh --check
          deploy/contracts/test-determinism.sh
