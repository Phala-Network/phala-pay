name: Release

# A versioned release of the service and all SDK packages (deploy/README.md, "Releases"), from a
# `v<version>` tag on a commit of main whose Cargo workspace version is <version>, the version that
# sdk/js, sdk/js-react, sdk/js-server, and sdk/python share (scripts/version.sh; CONTRIBUTING.md, "Releasing"). A stable version
# needs its dated CHANGELOG.md section, the release notes, with the SDKs' changes under it; a
# version with a pre-release suffix (`-rc.1`) is published as a GitHub pre-release of the service
# alone, without the SDKs. Only admins create `v*` tags (a tag ruleset), and a published release is
# immutable.
#
# `ci` runs the whole CI workflow on the tagged commit, the SDKs' checks and end-to-end tests
# included; nothing is built unless it passes. Each image is then built on its own GitHub-hosted
# runner by deploy/verify-image.sh (Buildx v0.37.1 and the pinned BuildKit, as a local rebuild
# uses), pushed tagged v<version>, and attested (actions/attest-build-provenance, also pushed to the
# registry):
# All three pushed digests must equal an earlier build. Each final digest is scanned and gets
# signed provenance and SPDX SBOM attestations.
# `assets` then builds, checks, and attests the release assets: images.json (the repository@sha256
# references by image name, deploy/render.sh's --images); the deploy kit
# phala-pay-deploy-v<version>.tar.gz (deploy/build-kit.sh); phala-cloud-template.yml (the Phala
# Cloud template's compose, rendered from the kit with these images); deploy.sh (deploy/deploy.sh,
# the one-command deploy, set to deploy this release, whose Python SDK it generates the admin key
# with); and SHA256SUMS. Only then does a stable version publish the
# SDKs: sdk/js, sdk/js-react, and sdk/js-server to npm, and sdk/python to PyPI as phala-pay (its `project.name`).
# Publishing uses trusted publishing (OIDC) only: no token or secret is stored anywhere. The owner
# registers this repository, this workflow file (release.yml), and the job's environment as the
# trusted publisher: `npm` on npmjs.com and `pypi` on pypi.org. Each environment accepts only `v*`
# tags and may add required reviewers. npm's trusted publishing does not support self-hosted
# runners, so the publish jobs run on GitHub-hosted runners. Last, `release` publishes the GitHub
# release with those assets, and `deploy-entry` checks that https://pay.phala.com/deploy.sh serves
# it. Every job can be re-run alone after a failure (CONTRIBUTING.md, "Recovering a release").
# deploy/verify-release.sh verifies all of it (docs/self-hosting.md, "Verify a release").

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  rollback:
    uses: ./.github/workflows/deploy-rollback.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, the version, and the changelog
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          # The Cargo workspace version, which the SDKs must name too.
          cargo_version=$(scripts/version.sh)
          [[ "$cargo_version" == "$version" ]] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match the Cargo workspace version $cargo_version"; exit 1; }
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME is not a commit of main"; exit 1; }
          # Stable releases only go up: an older one would take Latest, and npm's `latest`, from a
          # newer one.
          if [[ "$version" != *-* ]]; then
            newest=$(git ls-remote --tags --refs origin 'v*' |
              sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -n 1)
            [[ "$(printf '%s\n' "$newest" "$version" | sort -V | tail -n 1)" == "$version" ]] ||
              { echo "::error::v$newest is newer than $GITHUB_REF_NAME, which would take Latest from it"; exit 1; }
          fi
          [[ "$version" == *-* ]] || scripts/changelog-section.sh CHANGELOG.md "$version" >/dev/null
          echo "version=$version" >>"$GITHUB_OUTPUT"

  image:
    needs: [ci, rollback, codeql, version]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: phala-pay
            dockerfile: Dockerfile
            smoke: topup --help
          - name: postgres-walg
            dockerfile: deploy/Dockerfile.postgres-walg
            smoke: wal-g --version
          - name: phala-pay-reference-product
            dockerfile: deploy/Dockerfile.reference-product
            smoke: --help
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two from-scratch Rust release builds; the runner's preinstalled SDKs are not needed.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # The Buildx version deploy/verify-image.sh requires; it builds on its own pinned BuildKit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver: docker
          use: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        id: publish
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SMOKE: ${{ matrix.smoke }}
          IMAGE_REF_FILE: ${{ runner.temp }}/image.ref
          TMPDIR: ${{ runner.temp }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          PUBLISH_IMAGE="$repository:$GITHUB_REF_NAME" deploy/verify-image.sh
          ref=$(cat "$IMAGE_REF_FILE")
          read -ra smoke <<<"$SMOKE"
          docker run --rm --pull=always "$ref" "${smoke[@]}" >/dev/null
          { echo "name=$repository"; echo "digest=${ref#*@}"; } >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ref" && jq -n --arg name "${{ matrix.name }}" --arg ref "$ref" \
            '{($name): $ref}' >"$RUNNER_TEMP/ref/${{ matrix.name }}.json"
      - uses: ./.github/actions/security
        with:
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ steps.publish.outputs.name }}@${{ steps.publish.outputs.digest }}
      - name: Generate the final digest's SPDX SBOM after the equality check
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          severity: HIGH,CRITICAL
          image-ref: ${{ steps.publish.outputs.name }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output: ${{ runner.temp }}/sbom.spdx.json
          cache-dir: ${{ runner.temp }}/trivy-cache
          timeout: 15m
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/ref/${{ matrix.name }}.json
          if-no-files-found: error

  # Every release asset is built, checked, and attested before anything is published to a registry:
  # a failure here leaves no SDK published without its service release. The kit renders the example
  # environment and Phala's with these images; the template's compose is rendered from the kit
  # itself. A stable release's deploy.sh pins its own Python SDK, published before the release.
  assets:
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/refs
      - name: Write images.json, build the deploy kit, render the template, and set deploy.sh's release
        run: |
          dist="$RUNNER_TEMP/dist" kit="$RUNNER_TEMP/kit"
          mkdir -p "$dist" "$kit"
          jq -s 'add' "$RUNNER_TEMP"/refs/*.json >"$dist/images.json"
          jq -e 'keys == ["phala-pay", "phala-pay-reference-product", "postgres-walg"]' "$dist/images.json"
          deploy/build-kit.sh "$GITHUB_REF_NAME" "$dist"
          tar -xzf "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" -C "$kit" --strip-components=1
          for environment in "$kit/deploy/environments/example/topup" deploy/environments/phala-network/*/*/; do
            "$kit/deploy/render.sh" --images "$dist/images.json" --gateway-domain gateway.release.invalid \
              "$environment" >/dev/null
          done
          "$kit/deploy/render.sh" --template --images "$dist/images.json" \
            "$kit/deploy/environments/phala-cloud-template/topup" >"$dist/phala-cloud-template.yml"
          sed "s/^release=latest\$/release=$GITHUB_REF_NAME/" deploy/deploy.sh >"$dist/deploy.sh"
          grep -qx "release=$GITHUB_REF_NAME" "$dist/deploy.sh"
          (cd "$dist" && sha256sum images.json "phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            phala-cloud-template.yml deploy.sh >SHA256SUMS)
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/images.json
            ${{ runner.temp }}/dist/phala-pay-deploy-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/dist/phala-cloud-template.yml
            ${{ runner.temp }}/dist/deploy.sh
            ${{ runner.temp }}/dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # The SDKs' checks and end-to-end tests ran in `ci`; this builds the sdist and wheel that
  # py-publish uploads, outside the job that can mint the publishing token.
  py-build:
    needs: [ci, rollback, codeql, version]
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Build the sdist and wheel
        run: uv build --project sdk/python --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-python-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # A re-run uploads the same build and skips the files PyPI already has, so it completes a
  # partial upload (the sdist without the wheel, say).
  py-publish:
    needs: [py-build, assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  js-publish:
    needs: [version, assets]
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/sdk-js
        with:
          e2e: "false"
      - name: npm supports trusted publishing (11.5.1 or later)
        working-directory: sdk/js
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - name: Build all JavaScript packages
        working-directory: sdk/js
        run: pnpm --filter @phala/pay build && pnpm --filter @phala/pay-react build && pnpm --filter @phala/pay-server build
      - name: Publish all JavaScript packages to npm with provenance
        working-directory: sdk/js
        run: |
          # Check every name before publishing anything: npm cannot configure a trusted publisher
          # until the package exists. New scoped names need an owner bootstrap first.
          for package in @phala/pay @phala/pay-react @phala/pay-server; do
            if ! view=$(npm view "$package" name --json 2>/dev/null); then
              if [[ "$(jq -r '.error.code? // empty' <<<"$view" 2>/dev/null)" == E404 ]]; then
                echo "::error::${package} does not exist on npm. An @phala owner with publish rights and 2FA must first publish a public 0.0.0 placeholder, deprecate it as 'placeholder', then configure its GitHub Actions trusted publisher: Phala-Network/phala-pay, .github/workflows/release.yml, environment npm. Confirm this setup before retrying."
              else
                echo "::error::cannot check ${package} on npm: ${view}"
              fi
              exit 1
            fi
          done
          publish() {
            package=$1
            directory=$2
            if view=$(npm view "${package}@${VERSION}" gitHead --json 2>/dev/null); then
              [[ "$(jq -r . <<<"$view")" == "$GITHUB_SHA" ]] || {
                echo "::error::${package} ${VERSION} is already published, not from ${GITHUB_SHA}: ${view}"; exit 1;
              }
              echo "${package} ${VERSION} is already published from ${GITHUB_SHA}"
            elif [[ "$(jq -r '.error.code? // empty' <<<"$view" 2>/dev/null)" == E404 ]]; then
              if ! (cd "$directory" && npm publish --provenance --access public); then
                echo "::error::Publishing ${package} ${VERSION} failed. If npm reports E404 or an authentication error, confirm the package's GitHub Actions trusted publisher is configured for Phala-Network/phala-pay, .github/workflows/release.yml, environment npm. New packages require an owner-published public 0.0.0 placeholder (deprecated as 'placeholder') before trusted publishing can be configured. See the npm error above for other failures."
                exit 1
              fi
            else
              echo "::error::cannot read ${package} ${VERSION} from npm: ${view}"; exit 1
            fi
          }
          publish @phala/pay .
          publish @phala/pay-react ../js-react
          publish @phala/pay-server ../js-server

  # After the SDKs, which a pre-release skips: the release's notes link all three JS packages, and its
  # deploy.sh generates the admin key with its Python SDK.
  release:
    needs: [version, assets, py-publish, js-publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
      # `gh release create` uploads to a draft and publishes last, as immutable releases require.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/dist" notes="$RUNNER_TEMP/notes.md"
          # A stable release is Latest, which https://pay.phala.com/deploy.sh redirects to; a
          # pre-release never is.
          kind=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            kind=(--prerelease --latest=false)
            echo "Pre-release of the changes under [Unreleased] in CHANGELOG.md, without the SDKs." >"$notes"
          else
            scripts/changelog-section.sh CHANGELOG.md "$VERSION" >"$notes"
            {
              echo
              echo "## SDKs"
              echo
              echo "[\`@phala/pay\` $VERSION](https://www.npmjs.com/package/@phala/pay/v/$VERSION), [\`@phala/pay-react\` $VERSION](https://www.npmjs.com/package/@phala/pay-react/v/$VERSION), and [\`@phala/pay-server\` $VERSION](https://www.npmjs.com/package/@phala/pay-server/v/$VERSION) on npm;"
              echo "[\`phala-pay\` $VERSION](https://pypi.org/project/phala-pay/$VERSION/) on PyPI."
            } >>"$notes"
          fi
          {
            echo
            echo "## Verify"
            echo
            echo "[deploy/verify-release.sh](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/deploy/verify-release.sh)"
            echo "checks this release as Deploy does ([self-hosting guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-hosting.md#verify-a-release))."
          } >>"$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Phala Pay $VERSION" \
            --notes-file "$notes" "${kind[@]}" \
            "$dist/images.json" "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            "$dist/phala-cloud-template.yml" "$dist/deploy.sh" "$dist/SHA256SUMS"

  # The one-command deploy end to end: pay.phala.com's redirect, then GitHub's latest-release
  # download, must serve this release's deploy.sh (GitHub's redirect can lag a few minutes). Its own
  # job, so re-running it never re-creates the release.
  deploy-entry:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that https://pay.phala.com/deploy.sh serves this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p deploy.sh -D "$RUNNER_TEMP/release"
          for _ in $(seq 20); do
            if curl -fsSL --max-time 30 -o "$RUNNER_TEMP/served.sh" https://pay.phala.com/deploy.sh &&
              cmp -s "$RUNNER_TEMP/served.sh" "$RUNNER_TEMP/release/deploy.sh"; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::https://pay.phala.com/deploy.sh does not serve $GITHUB_REF_NAME's deploy.sh: is it the Latest release?"
          exit 1
