name: API reference

# Publishes the merchant API reference, built with Redoc (docs/reference, @redocly/cli pinned in its
# lockfile) from the committed crates/topup/openapi.json, to GitHub Pages on every push to main that
# changes it. Pull requests check that it builds in CI's sdk-js job. The repository's Pages source
# must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - crates/topup/openapi.json
      - docs/reference/**
      - .github/workflows/api-reference.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/reference/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the reference
        working-directory: docs/reference
        env:
          REDOCLY_TELEMETRY: "off"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/reference/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deployment job may write Pages and mint the OIDC token Pages requires.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
