name: Verify contracts

# Read-only: validates Phala's committed staging and production configurations and verifies the
# configured factories' and implementations' public bytecode against the committed reference.
# Public verification reads use keyless endpoints, separate from the service's keyed read/verify
# endpoints. RPC keys stay outside GitHub; these reads need no independent provider agreement.

on:
  schedule:
    # Daily, 04:41 UTC.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-contracts
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-contracts-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate the committed environment configurations
        run: |
          mkdir -p reports
          for environment in staging production; do
            cargo run --locked -q -p topup -- config show \
              "deploy/environments/phala-network/$environment/topup/topup.yaml" \
              >"reports/$environment-config.json"
          done

      - name: Resolve public verification targets
        run: |
          # config show resolves each route's default implementation address without secrets.
          jq -ers '
            {"1": "https://ethereum-rpc.publicnode.com",
             "8453": "https://base-rpc.publicnode.com",
             "11155111": "https://ethereum-sepolia-rpc.publicnode.com",
             "84532": "https://base-sepolia-rpc.publicnode.com"} as $endpoints
            | [.[] | . as $config | .rpc[].chain_id as $chain
               | ($endpoints[$chain | tostring]
                  // error("no public verification RPC mapping for chain \($chain)")) as $url
               | $config.routes[] | select(.chain.chain_id == $chain)
               | [$chain, $url, .chain.forwarder_factory, .chain.implementation]]
            | unique[] | @tsv' reports/staging-config.json reports/production-config.json \
            >reports/contract-targets.tsv

      - name: Verify the configured factory and implementation bytecode
        run: |
          status=0
          while IFS=$'\t' read -r chain rpc factory implementation; do
            actual_chain=$(cast chain-id --rpc-url "$rpc")
            [[ "$actual_chain" == "$chain" ]] ||
              { echo "::error::public verification RPC for chain $chain reports $actual_chain"; exit 1; }
            for contract in factory implementation; do
              address=${!contract}
              expected=$(jq -er --arg contract "$contract" '.[$contract + "_code_hash"]' \
                deploy/contracts/reference.json)
              code=$(cast code "$address" --rpc-url "$rpc")
              actual=$(cast keccak "$code")
              passed=false
              if [[ "$actual" == "$expected" ]]; then
                passed=true
              else
                echo "::error::chain $chain $contract $address bytecode does not match the reference"
                status=1
              fi
              jq -cn --argjson chain_id "$chain" --arg contract "$contract" --arg address "$address" \
                --arg expected "$expected" --arg actual "$actual" --argjson passed "$passed" \
                '{chain_id: $chain_id, contract: $contract, address: $address,
                  expected_code_hash: $expected, actual_code_hash: $actual, passed: $passed}' \
                >>reports/bytecode-verification.jsonl
            done
          done <reports/contract-targets.tsv
          jq -s '{passed: all(.[]; .passed), contracts: .}' reports/bytecode-verification.jsonl \
            >reports/contract-verification.json
          cat reports/contract-verification.json
          exit "$status"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
