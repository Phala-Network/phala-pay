name: Verify contracts

# Read-only: validates Phala's committed staging configuration and, through its two Sepolia RPC
# providers, checks the approved Safe and the deployed factory. It holds no key, so both providers
# must be keyless; they appear only as "sepolia/a" and "sepolia/b" in the reports.

on:
  schedule:
    # Daily, 04:41 UTC.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-contracts
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGING_CONFIG: deploy/environments/phala-network/staging/topup/topup.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-contracts-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate the committed staging configuration
        run: |
          mkdir -p reports
          cargo run --locked -q -p topup -- config show "$STAGING_CONFIG" >reports/staging-config.json

      - name: Verify the Safe and the factory deployment on both providers
        run: |
          # The first keyless members of the configuration's Sepolia A/B groups.
          IFS=$'\t' read -r RPC_A RPC_B < <(jq -r '
            def first_keyless($id):
              [.rpc_groups[$id].members[]? | select(.sealed_key == null) | .url][0]
              // error("RPC group \($id) has no keyless member");
            [.routes[] | select(.chain.chain_id == 11155111)][0].chain.rpc_groups as $groups
            | [first_keyless($groups.a), first_keyless($groups.b)] | @tsv' \
            reports/staging-config.json)
          [[ -n "$RPC_A" && -n "$RPC_B" && "$RPC_A$RPC_B" != *"{key}"* ]] ||
            { echo "::error::the staging configuration needs two keyless Sepolia providers"; exit 1; }
          status=0
          deploy/contracts/verify-safe.sh --rpc sepolia/a="$RPC_A" --rpc sepolia/b="$RPC_B" \
            >reports/sepolia-safe-verification.json || status=1
          deploy/contracts/verify-deployment.sh --rpc sepolia/a="$RPC_A" --rpc sepolia/b="$RPC_B" \
            >reports/sepolia-contract-verification.json || status=1
          jq '{passed, chains: [.chains[] | {target, passed}]}' reports/sepolia-*.json || true
          exit "$status"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
